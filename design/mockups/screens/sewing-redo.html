<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sewing Room</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/themes.css">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/frame.css">
<style>
  /* P4 redo of E3, the sewing room, as its own full page of the adventures tab's dungeon area
     (‹ the old well goes back to the well). Today it's crammed into the well's 236 px column, rooms
     are browsed one at a time, marks only count the army's 20 strongest, your pet and the plushie
     keeper never count, and hints are text only.
     Here: every known room shows (cleared ones with a coral pennant, the current one, the next as a
     carrot), the current room's marks are a checklist filled from YOUR picks (who's going in), and
     tapping a mark lights up the pets that fit it. The run (60 s) and its result stay on the page.
     ?look=A  the seats: tap a mark, then a pet that fits; the pet sits on it.
     ?look=B  the chalkboard and the shelf: tap pets; each one hangs under every mark it fits.
     ?state=run | done freezes the run / the result for screenshots.
     Decisions shown as "yes" here (open questions): marks count any pet you put in, not only the 20
     strongest; your active pet can go; the plushie keeper can go; one pet can fill two marks.
     Rooms and marks are the real ones from data/sewing.json (rolled rooms from Sewing.room). */
  :root { --wisp: #ff9e7d; --chalk: color-mix(in srgb, var(--text) 72%, transparent); --board: color-mix(in srgb, var(--mint) 7%, var(--deep)); }

  /* the full tab row of this stage: squeeze the spine a little so settings still fits */
  .spine { gap: 2px; }
  .spine .tab { padding: 4px 0 2px; font-size: 10px; letter-spacing: -.2px; }
  .moon { margin-bottom: 2px; }

  .label-look { position: fixed; right: 12px; bottom: 4px; font: 400 12px/1 var(--display); color: var(--muted); }
  .sew { display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 0; user-select: none; }
  .sbar { display: flex; align-items: center; gap: 10px; height: 28px; flex: none; }
  .sbar h2 { margin: 0; font: 400 20px/1 var(--display); color: var(--pink); white-space: nowrap; }
  .sbar .back { color: var(--muted); font-size: 12px; }
  .wispchip { margin-left: auto; display: flex; align-items: center; gap: 7px; padding: 2px 14px 2px 8px; border-radius: 999px; background: var(--deep); border: 2px solid color-mix(in srgb, var(--wisp) 40%, var(--line)); color: var(--wisp); }
  .wispchip b { font: 400 17px/1 var(--display); font-variant-numeric: tabular-nums; }
  .wispchip.bump b { animation: bump .5s var(--ease-out); }
  @keyframes bump { 30% { transform: scale(1.2); color: var(--text); } }
  .wispico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }
  .h3 { margin: 0; font: 400 14px/1 var(--display); color: var(--lilac); white-space: nowrap; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }

  .feel { display: inline-flex; align-items: center; padding: 0 8px; border-radius: 999px; font-size: 11px; line-height: 18px; background: var(--deep); border: 2px solid var(--line); color: var(--muted); white-space: nowrap; }
  .feel.mid { color: var(--text); border-color: color-mix(in srgb, var(--lilac) 35%, var(--line)); }
  .feel.hot { color: var(--pink); border-color: var(--pink-seam); }
  .carrot { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border-radius: 999px; font-size: 11px; line-height: 18px; color: var(--lilac); border: 2px dashed var(--lilac-seam); white-space: nowrap; }
  .pennant { display: inline-flex; align-items: center; gap: 4px; color: var(--wisp); font-size: 11px; white-space: nowrap; }

  /* room pictures (the game's SewingRoom PICS) */
  .pic { display: block; overflow: visible; }
  .pic * { fill: none; stroke: var(--lilac); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .pic .p { stroke: var(--pink); }
  .pic .c { stroke: var(--wisp); }
  .pic .f { fill: color-mix(in srgb, var(--lilac) 18%, transparent); }
  .pic.small * { stroke-width: 4; }

  /* chalk marks (the game's ChalkMark drawings) */
  .ch { display: block; overflow: visible; }
  .ch * { fill: none; stroke: var(--chalk); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 3.2 2.2; vector-effect: non-scaling-stroke; }
  .ch.on * { stroke-dasharray: none; }
  .ch.on .fl * { fill: color-mix(in srgb, var(--chalk) 45%, transparent); }
  .ch.tier * { stroke: var(--tc); }
  .ch.tier.on .fl * { fill: var(--tc); }
  .ch text { stroke: none; fill: var(--chalk); font: 400 9px var(--display); stroke-dasharray: none; }
  .ch.on text { fill: var(--deep); }
  .ch.mini * { stroke-width: 1.5; stroke-dasharray: none; }
  .ch.mini .fl * { fill: color-mix(in srgb, var(--chalk) 35%, transparent); }
  .pop { animation: pop .4s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes pop { from { transform: scale(.4); } }

  /* pet cards (army choices, the strongest first) */
  .pc { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px 5px; background: var(--raised); border: 2px solid color-mix(in srgb, var(--tc) 80%, var(--deep)); border-radius: var(--r-lg); box-shadow: 0 3px 7px rgba(6, 2, 12, .5); cursor: pointer; transition: transform .15s var(--ease-out), opacity .15s; min-width: 0; }
  .pc:hover { transform: translateY(-2px) rotate(-1deg); }
  .pc img { width: 48px; height: 54px; }
  .pc .nm { font-size: 10px; line-height: 1.1; max-width: 100%; padding: 0 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .pc.dim { opacity: .3; }
  .pc.dim:hover { transform: none; }
  .pc.fit { border-color: var(--tc); transform: translateY(-3px); box-shadow: var(--lift); }
  .pc.in { outline: 2px dashed var(--pink); outline-offset: 2px; }
  .pc .tick { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--deep); border: 2px solid var(--chalk); display: grid; place-items: center; }
  .pc .tick svg { width: 10px; height: 10px; fill: none; stroke: var(--chalk); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .pc .who { position: absolute; top: 3px; left: 4px; width: 14px; height: 14px; }
  .pc .bt { position: absolute; top: 3px; right: 4px; display: flex; gap: 1px; }
  .pc .bt i { width: 6px; height: 6px; border-radius: 50%; background: var(--wisp); }
  .pc .fin { position: absolute; left: 4px; top: 44px; width: 13px; height: 13px; }
  .pc .fin .ch * { stroke: var(--lilac); stroke-width: 1.4; stroke-dasharray: none; }

  .tick-svg { fill: none; stroke: var(--chalk); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .from { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
  .from .link { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 5px; border: 2px solid var(--line); border-radius: 999px; background: var(--deep); color: var(--text); font-size: 11px; }
  .from .link:hover { color: var(--pink); border-color: var(--pink-seam); }
  .from svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .mound { position: relative; flex: none; }
  .mound img { position: absolute; width: 16px; height: 18px; }
  .mound img.flip { transform: scaleX(-1); }
  .more { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .more b { font: 400 15px/1 var(--display); color: var(--text); font-weight: 400; }

  .go { padding: 7px 16px; flex: none; }
  .go:disabled { border-color: var(--muted-seam); }
  .go.running:disabled { border-color: var(--pink-seam); color: var(--pink); }

  /* the run: tiny pets tiptoe through the room */
  .runline { position: relative; }
  .marcher { position: absolute; bottom: 0; display: flex; align-items: flex-end; transition: left .1s linear; }
  .marcher img { width: 16px; height: 18px; margin-right: -5px; animation: hop .5s ease-in-out infinite; }
  .marcher img:nth-child(2n) { animation-delay: .25s; }
  @keyframes hop { 50% { transform: translateY(-3px); } }
  .clock { font: 400 26px/1 var(--display); color: var(--text); font-variant-numeric: tabular-nums; }
  .meter { position: relative; height: 10px; border-radius: 999px; background: var(--deep); border: 2px solid color-mix(in srgb, var(--lilac) 45%, var(--line)); }
  .meter i { position: absolute; inset: 0 auto 0 0; width: calc(var(--f) * 100%); background: var(--lilac); border-radius: 999px; }

  .result { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .result .big { font: 400 20px/1 var(--display); color: var(--wisp); display: inline-flex; align-items: center; gap: 6px; }
  .result .big .wispico { width: 22px; height: 22px; }
  .result .home { font-size: 12px; color: var(--muted); }
  .result .home b { color: var(--text); font-weight: 400; }
  .result .btns { display: flex; gap: 8px; }
  .flagbig { width: 30px; height: 30px; }

  /* ================= Look A: the seats ================= */
  .strip { flex: none; display: flex; gap: 5px; padding: 6px 8px; background: var(--paper); border: 2px solid var(--line); border-radius: var(--r-panel); }
  .tile { position: relative; flex: 1 1 0; min-width: 0; height: 42px; display: grid; place-items: center; padding: 0; border-radius: 9px; background: var(--deep); border: 2px solid var(--line); cursor: pointer; transition: transform .15s var(--ease-out); }
  .tile:hover { transform: translateY(-2px); border-color: var(--lilac-seam); }
  .tile .pic { width: 36px; height: 18px; }
  .tile .pf { position: absolute; top: -5px; right: -3px; width: 13px; height: 13px; }
  .tile.done { border-color: color-mix(in srgb, var(--wisp) 40%, var(--line)); }
  .tile.cur { border: 2px dashed var(--pink); background: var(--raised); transform: rotate(-3deg); }
  .tile.view { box-shadow: 0 0 0 2px var(--page), 0 0 0 4px var(--pink-seam); }
  .tile.cur.view { box-shadow: none; }
  .tile.next { border: 2px dashed var(--lilac-seam); background: none; cursor: default; }
  .tile.next .pic { opacity: .35; }
  .tile.next:hover { transform: none; }
  .tile.fresh { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }

  .agrid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 318px; gap: 12px; }
  .roomcard { display: flex; flex-direction: column; gap: 10px; padding: 10px 12px 12px; min-height: 0; }
  .rhead { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .rhead h3 { margin: 0; font: 400 18px/1 var(--display); color: var(--pink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rhead .feel { margin-left: auto; }
  .scene { position: relative; height: 118px; flex: none; border: 2px dashed var(--lilac-seam); border-radius: 60px 60px 12px 12px; background: var(--deep); display: grid; place-items: center; overflow: hidden; }
  .scene .pic { width: 196px; height: 97px; }
  .scene .runline { position: absolute; left: 14px; right: 14px; bottom: 8px; height: 20px; }
  .scene .clockbox { position: absolute; top: 12px; right: 18px; }
  .seats-h { display: flex; align-items: center; gap: 8px; }
  .seats { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; padding: 10px; border-radius: 12px; background: var(--board); border: 2px solid color-mix(in srgb, var(--chalk) 30%, var(--line)); }
  .seat { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 2px 8px; border-radius: 10px; border: 2px solid transparent; background: none; cursor: pointer; min-width: 0; }
  .seat:hover { background: color-mix(in srgb, var(--chalk) 8%, transparent); }
  .seat.sel { border: 2px dashed var(--pink); background: color-mix(in srgb, var(--pink) 8%, transparent); }
  .seat .ch { width: 34px; height: 34px; }
  .seat .lbl { font-size: 11px; color: var(--chalk); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .seat.met .lbl { color: var(--text); }
  .seat .slot { width: 46px; height: 52px; display: grid; place-items: end center; padding-bottom: 3px; border-radius: 9px; border: 2px dashed color-mix(in srgb, var(--chalk) 45%, transparent); }
  .seat .slot.full { border: 2px solid color-mix(in srgb, var(--tc) 80%, var(--deep)); background: var(--raised); box-shadow: 0 3px 6px rgba(6, 2, 12, .5); }
  .seat .slot img { width: 32px; height: 36px; }
  .seat .slot.same img { opacity: .55; }
  .seat .x { position: absolute; top: 2px; right: 4px; width: 18px; height: 18px; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--muted); font-size: 11px; line-height: 1; cursor: pointer; }
  .seat .x:hover { color: var(--pink); background: var(--deep); }
  .rfoot { margin-top: auto; display: flex; align-items: center; gap: 10px; }
  .rfoot .go { margin-left: auto; }

  .picker { display: flex; flex-direction: column; gap: 10px; padding: 10px 12px 12px; min-height: 0; }
  .phead { display: flex; align-items: center; gap: 8px; min-height: 26px; }
  .phead .ch { width: 22px; height: 22px; }
  .phead .pager { margin-left: auto; display: inline-flex; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
  .pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 10px; padding: 6px 4px 0; }
  .pgrid .pc { padding: 10px 2px 8px; }
  .picker .from { margin-top: auto; padding-top: 8px; border-top: 2px dashed var(--line); min-height: 30px; }

  /* ================= Look B: the chalkboard and the shelf ================= */
  .bgrid { flex: 1; min-height: 0; display: grid; grid-template-columns: 232px 1fr; gap: 12px; }
  .rlist { display: flex; flex-direction: column; min-height: 0; padding: 8px 6px 8px 8px; }
  .rlist .h3 { padding: 2px 4px 8px; }
  .rows { flex: 1; min-height: 0; overflow: hidden auto; display: flex; flex-direction: column; gap: 3px; padding: 2px 4px 4px 2px; scrollbar-width: thin; scrollbar-color: var(--lilac-seam) transparent; }
  .rrow { flex: none; display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 4px; border-radius: 9px; border: 2px solid transparent; background: none; cursor: pointer; text-align: left; color: var(--text); font-size: 11px; }
  .rrow:hover { background: var(--deep); }
  .rrow .pic { width: 34px; height: 17px; }
  .rrow .rn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rrow .pennant { font-size: 10.5px; }
  .rrow .pennant svg { width: 11px; height: 11px; }
  .rrow.cur { border: 2px dashed var(--pink); background: var(--raised); color: var(--pink); }
  .rrow.view:not(.cur) { border-color: var(--pink-seam); background: var(--deep); }
  .rrow.next { border: 2px dashed var(--lilac-seam); color: var(--muted); cursor: default; }
  .rrow.next .pic { opacity: .35; }
  .rrow.next:hover { background: none; }
  .rrow.fresh { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }

  .bcenter { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
  .board { position: relative; flex: none; height: 198px; padding: 10px 12px; border-radius: var(--r-panel); background: var(--board); border: 2px solid color-mix(in srgb, var(--chalk) 30%, var(--line)); box-shadow: var(--lift); display: flex; flex-direction: column; gap: 6px; }
  .board .bh { display: flex; align-items: center; gap: 8px; }
  .board .bh h3 { margin: 0; font: 400 18px/1 var(--display); color: var(--chalk); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .board .bh .pic { width: 52px; height: 26px; flex: none; }
  .board .bh .feel { margin-left: auto; }
  .bmarks { position: relative; flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .bmarks::before { content: ""; position: absolute; left: 4px; right: 4px; top: 76px; height: 2px; background: color-mix(in srgb, var(--chalk) 45%, transparent); border-radius: 1px; }
  .bm { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px 0; border-radius: 10px; border: 2px solid transparent; background: none; cursor: pointer; min-width: 0; }
  .bm:hover { background: color-mix(in srgb, var(--chalk) 7%, transparent); }
  .bm.sel { border: 2px dashed var(--pink); }
  .bm .ch { width: 40px; height: 40px; }
  .bm .lbl { font-size: 11px; color: var(--chalk); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .bm.met .lbl { color: var(--text); }
  .bm .peg { position: relative; width: 8px; height: 12px; margin-top: 2px; border-radius: 2px; background: color-mix(in srgb, var(--wisp) 70%, var(--deep)); z-index: 1; }
  .bm .hang { display: flex; justify-content: center; margin-top: -4px; }
  .bm .pola { width: 40px; height: 46px; display: grid; place-items: end center; padding-bottom: 2px; border-radius: 6px; background: var(--raised); border: 2px solid color-mix(in srgb, var(--tc) 80%, var(--deep)); box-shadow: 0 3px 6px rgba(6, 2, 12, .5); transform: rotate(var(--rot, -3deg)); transform-origin: top center; }
  .bm .pola + .pola { margin-left: -24px; }
  .bm .pola img { width: 32px; height: 36px; }
  .bm .empty { width: 40px; height: 46px; border-radius: 6px; border: 2px dashed color-mix(in srgb, var(--chalk) 40%, transparent); }
  .board .runbox { flex: 1; display: grid; grid-template-columns: 1fr auto; gap: 10px 16px; align-items: center; }
  .board .runbox .scene2 { position: relative; height: 128px; display: grid; place-items: center; }
  .board .runbox .scene2 .pic { width: 230px; height: 113px; }
  .board .runbox .scene2 .runline { position: absolute; left: 0; right: 0; bottom: 0; height: 20px; }
  .board .runbox .meter { grid-column: 1 / -1; }
  .board .postcard { align-self: center; width: 330px; margin-top: 0; padding: 8px 14px 10px; border-radius: var(--r-xl); background: var(--raised); border: 2px solid color-mix(in srgb, var(--wisp) 55%, var(--lilac-seam)); box-shadow: var(--lift); transform: rotate(-1.5deg); display: flex; flex-direction: column; justify-content: center; }
  .board .postcard .result { gap: 5px; }
  .board .postcard .flagbig, .board .postcard .pennant svg { width: 22px; height: 22px; }
  .board .postcard .rn { font: 400 16px/1 var(--display); color: var(--pink); }

  .bench { flex: none; height: 62px; display: flex; align-items: center; gap: 10px; padding: 6px 12px; }
  .bench .h3 { flex: none; }
  .going { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; overflow: hidden; }
  .gp { position: relative; flex: none; width: 36px; height: 42px; display: grid; place-items: end center; padding-bottom: 2px; border-radius: 8px; background: var(--raised); border: 2px solid color-mix(in srgb, var(--tc) 80%, var(--deep)); cursor: pointer; }
  .gp img { width: 32px; height: 36px; }
  .gp:hover::after { content: "✕"; position: absolute; top: -7px; right: -7px; width: 16px; height: 16px; border-radius: 50%; background: var(--deep); border: 2px solid var(--pink-seam); color: var(--pink); font-size: 9px; line-height: 13px; text-align: center; }
  .gp.empty { border: 2px dashed var(--line); background: none; cursor: default; }
  .gp.empty:hover::after { content: none; }
  .bench .more { margin-left: 4px; }

  .shelf { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 12px; }
  .shelf .sh { display: flex; align-items: center; gap: 8px; }
  .shelf .sh .pager { margin-left: auto; display: inline-flex; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
  .sgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px 8px; padding: 2px 4px 0; }
  .sgrid .pc img { width: 32px; height: 36px; }
  .sgrid .pc { padding-top: 7px; }
  .sgrid .pc .fin { top: 32px; }
  .fits { display: flex; gap: 2px; height: 14px; }
  .fits .ch { width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="app" data-tab="trips" data-say=""></div>
<div class="label-look" id="look"></div>
<script src="../shared/pixel.js"></script>
<script src="../shared/frame.js"></script>
<script>
  // the game's tabs at this stage (as in well-additions.html)
  DOODLES.capsule = `<circle cx="12" cy="10" r="6.8"/><path d="M5.3 10 Q12 12.4 18.7 10"/><path d="M7.4 16 L6.6 20.4 Q12 21.2 17.4 20.4 L16.6 16"/>`;
  ICONS.capsule = ICONS.boxes;
  DOODLES.automation = `<circle cx="12" cy="12" r="2.6"/><path d="M12 5.2 Q16.8 5.4 18.6 9.6 Q19.4 14.6 15.6 17.8 Q11 20.4 6.8 17.4 Q3.9 13.6 5.8 8.6 Q7.8 5.4 12 5.2 Z"/><path d="M12 2.6 L12 5.2 M12 18.8 L12 21.4 M2.6 12 L5.2 12 M18.8 12 L21.4 12 M5.4 5.4 L7.1 7.1 M16.9 16.9 L18.6 18.6 M5.4 18.6 L7.1 16.9 M16.9 7.1 L18.6 5.4"/>`;
  ICONS.automation = ICONS.settings;
  TABS.splice(1, 0, { id: "capsules", label: "machine", icon: "capsule" });
  TABS.splice(TABS.findIndex(t => t.id === "gear"), 1);
  TABS.find(t => t.id === "pets").label = "collectibles";
  TABS.find(t => t.id === "trips").label = "adventures";
  TABS.find(t => t.id === "inventory").label = "workbench";
  TABS.splice(TABS.findIndex(t => t.id === "errands") + 1, 0, { id: "automation", label: "automation", icon: "automation" });
  TABS.forEach(t => { t.news = false; });

  const q = new URLSearchParams(location.search);
  const LOOK = (q.get("look") || "A").toUpperCase() === "B" ? "B" : "A";
  const SAY = {
    A: "ooh, lazy ones! i'm a lazy one. can i come?",
    B: "it's so quiet in here. like a pocket.",

      <span class="pennant">${PENNANT(30)}</span>
      <span class="big">${WISP(22)}+${(d.got / 1000).toFixed(1)}k</span>
      <span class="home"><b class="num">${d.back.toLocaleString("en")}</b> of ${d.sent.toLocaleString("en")} came home</span>
      <div class="btns"><button class="btn" data-act="again">again</button>${d.first && next && next.marks.length ? `<button class="btn primary" data-act="next">${next.name} ›</button>` : ""}</div>
    </div>`;
  };

  // ---------------- Look A: the seats ----------------
  function renderA() {
    const r = room(), cur = isCur();
    const tiles = ROOMS.slice(0, S.cleared + 2).map(x => {
      const st = x.i < S.cleared ? "done" : x.i === S.cleared ? "cur" : "next";
      return `<button class="tile ${st}${x.i === S.view ? " view" : ""}${x.fresh ? " fresh" : ""}" data-room="${x.i}" title="${x.name}">${picSvg(x.pic, "small")}${st === "done" ? `<span class="pf">${PENNANT(13)}</span>` : ""}</button>`;
    }).join("");
    const w = feel();
    const next = ROOMS[S.cleared + 1];
    let mid;
    if (S.done) {
      mid = `<div class="seats" style="display:block;padding:14px">${resultHtml()}</div>`;
    } else {
      const seats = r.marks.map(m => {
        const u = S.seats[m], p = u != null ? byU(u) : null;
        const first = p && Object.keys(S.seats).find(k => S.seats[k] === u) === m;
        return `<button class="seat${S.sel === m && !S.run ? " sel" : ""}${p ? " met" : ""}" data-mark="${m}">
          ${chalk(m, !!p, p && m === S.justFilled ? "pop" : "")}
          <span class="lbl">${markName(m)}</span>
          <span class="slot${p ? " full" : ""}${p && !first ? " same" : ""}" ${p ? `style="--tc:var(--tier-${p.t})"` : ""}>${p ? `<img class="px" src="../assets/pets/${p.id}.png" alt="">` : ""}</span>
          ${p && !S.run ? `<span class="x" data-clear="${m}" title="take off">✕</span>` : ""}
        </button>`;
      }).join("");
      mid = `<div class="seats-h"><span class="h3">who's going in</span></div><div class="seats">${seats}</div>`;
    }
    let scene = picSvg(r.pic);
    if (S.run) {
      const b = runBits();
      scene += `<div class="runline">${marcher(b.f)}</div><div class="clockbox"><span class="clock">${b.left}</span></div>`;
    }
    const goLabel = S.run ? "on the way…" : cur ? "in we go!" : "again!";
    const sel = S.sel;
    const picks = CREW.map(p => {
      const inIt = going().includes(p);
      let cls = inIt ? "in" : "";
      let tick = false;
      if (sel && !S.run && !S.done) { if (fits(p, sel)) { cls += " fit"; tick = true; } else cls += " dim"; }
      else if (S.run && !inIt) cls += " dim";
      return petCard(p, { cls, tick, under: "" });
    }).join("");
    content.innerHTML = `<div class="sew">
      <div class="sbar"><button class="link back">‹ the old well</button><h2>the sewing room</h2><span class="wispchip">${WISP()}<b class="num">${S.wisps.toLocaleString("en")}</b></span></div>
      <div class="strip">${tiles}</div>
      <div class="agrid">
        <div class="roomcard sticker">
          <div class="rhead"><h3>${r.name}</h3>${cur && next && !S.done ? `<span class="carrot">→ ${next.name}</span>` : ""}${!cur && !S.done ? `<span class="pennant">${PENNANT()}${LAST_PAY[r.i] ? `+${LAST_PAY[r.i]}` : ""}</span>` : ""}<span class="feel ${w[1]}">${w[0]}</span></div>
          <div class="scene">${scene}</div>
          ${mid}
          <div class="rfoot">${S.done ? "" : `${mound(HERD, 56)}<span class="more">and <b class="num">${HERD.toLocaleString("en")}</b> more</span>`}
            ${S.done ? "" : `<button class="btn primary go${S.run ? " running" : ""}" data-act="go" ${allMet() && !S.run ? "" : "disabled"}>${goLabel}</button>`}</div>
        </div>
        <div class="picker sticker">
          <div class="phead">${sel && !S.run && !S.done ? `${chalk(sel, met(sel))}<span class="h3">${MANY[sel] || markName(sel)}</span>` : `<span class="h3">pets</span>`}
            <span class="pager"><button class="link">‹</button>1 of 6<button class="link">›</button></span></div>
          <div class="pgrid">${picks}</div>
          <div class="from">${sel && !S.run && !S.done ? fromRow(sel) : ""}</div>
        </div>
      </div>
    </div>`;
    S.justFilled = null;
  }

  // ---------------- Look B: the chalkboard and the shelf ----------------
  function renderB() {
    const r = room(), cur = isCur();
    const rows = ROOMS.slice(0, S.cleared + 2).map(x => {
      const st = x.i < S.cleared ? "done" : x.i === S.cleared ? "cur" : "next";
      const right = st === "done" ? `<span class="pennant" title="+${LAST_PAY[x.i]} last time">${PENNANT(11)}</span>` : "<span></span>";
      return `<button class="rrow ${st}${x.i === S.view ? " view" : ""}${x.fresh ? " fresh" : ""}" data-room="${x.i}">${picSvg(x.pic, "small")}<span class="rn">${x.name}</span>${right}</button>`;
    }).join("");
    const w = feel();
    const next = ROOMS[S.cleared + 1];
    let boardIn;
    if (S.run || S.done) {
      const b = S.run ? runBits() : { left: "0:00", f: 1 };
      boardIn = `<div class="runbox"><div class="scene2">${picSvg(r.pic)}<div class="runline">${S.run ? marcher(b.f) : ""}</div></div>
        <span class="clock">${b.left}</span><div class="meter" style="--f:${b.f}"><i></i></div></div>`;
      if (S.done) boardIn = `<div class="postcard">${resultHtml()}</div>`;
    } else {
      const marks = r.marks.map((m, i) => {
        const hung = S.bench.map(byU).filter(p => fits(p, m)).slice(0, 2);
        return `<button class="bm${S.sel === m ? " sel" : ""}${hung.length ? " met" : ""}" data-mark="${m}">
          ${chalk(m, hung.length > 0, hung.length && S.justFilled && S.justFilled.includes(m) ? "pop" : "")}<span class="lbl">${markName(m)}</span>
          <span class="peg"></span>
          <span class="hang">${hung.length ? hung.map((p, k) => `<span class="pola" style="--tc:var(--tier-${p.t});--rot:${[-4, 3, -2, 4][(i + k) % 4]}deg"><img class="px" src="../assets/pets/${p.id}.png" alt=""></span>`).join("") : `<span class="empty"></span>`}</span>
        </button>`;
      }).join("");
      boardIn = `<div class="bmarks">${marks}</div>`;
    }
    const benchPets = S.bench.map(byU).map(p => `<span class="gp" data-off="${p.u}" style="--tc:var(--tier-${p.t})" title="${nm(p)}"><img class="px" src="../assets/pets/${p.id}.png" alt=""></span>`).join("");
    const shelf = CREW.map(p => {
      const f = r.marks.filter(m => fits(p, m));
      let cls = S.bench.includes(p.u) ? "in" : "";
      if (S.sel && !S.run && !S.done) cls += fits(p, S.sel) ? " fit" : " dim";
      return petCard(p, { cls, under: `<span class="fits">${f.map(m => chalk(m, met(m), "mini")).join("")}</span>` });
    }).join("");
    const goLabel = S.run ? "on the way…" : cur ? "in we go!" : "again!";
    content.innerHTML = `<div class="sew">
      <div class="sbar"><button class="link back">‹ the old well</button><h2>the sewing room</h2><span class="wispchip">${WISP()}<b class="num">${S.wisps.toLocaleString("en")}</b></span></div>
      <div class="bgrid">
        <div class="rlist sticker"><span class="h3">rooms</span><div class="rows">${rows}</div></div>
        <div class="bcenter">
          <div class="board">
            <div class="bh">${picSvg(r.pic, "small")}<h3>${r.name}</h3>${cur && next && !S.run && !S.done ? `<span class="carrot">→ ${next.name}</span>` : ""}<span class="feel ${w[1]}">${w[0]}</span></div>
            ${boardIn}
          </div>
          <div class="bench sticker"><span class="h3">who's going in</span>
            <div class="going">${benchPets}<span class="more">${mound(HERD, 56)}and <b class="num">${HERD.toLocaleString("en")}</b> more</span></div>
            ${S.done ? "" : `<button class="btn primary go${S.run ? " running" : ""}" data-act="go" ${allMet() && !S.run ? "" : "disabled"}>${goLabel}</button>`}
          </div>
          <div class="shelf sticker">
            <div class="sh">${S.sel ? `${chalk(S.sel, met(S.sel), "mini")}<span class="h3">${MANY[S.sel] || markName(S.sel)}</span><span class="from" style="margin-left:6px">${fromRow(S.sel)}</span>` : `<span class="h3">pets</span>`}
              <span class="pager"><button class="link">‹</button>1 of 6<button class="link">›</button></span></div>
            <div class="sgrid">${shelf}</div>
          </div>
        </div>
      </div>
    </div>`;
    const v = content.querySelector(".rrow.view");
    const box = content.querySelector(".rows");
    if (S.view >= S.cleared - 1) box.scrollTop = box.scrollHeight;
    else if (v) box.scrollTop = Math.max(0, v.offsetTop - box.offsetTop - box.clientHeight / 2);
    S.justFilled = null;
  }

  // ---------------- play ----------------
  S.wisps = 12480;
  const render = () => { (LOOK === "A" ? renderA : renderB)(); paintIcons(); };
  let timer = null;
  function go() {
    S.run = { t: 0 }; S.sel = null; say(SAY.run); render();
    timer = setInterval(() => {
      S.run.t += 1;  // a 60 s run, 10x faster in the mockup
      if (S.run.t >= 60) { clearInterval(timer); finish(); } else render();
    }, 100);
  }
  function finish() {
    const sent = going().length + HERD, first = S.view === S.cleared;
    S.done = { room: S.view, got: 1400, sent, back: sent - 13, first };
    S.run = null;
    if (first) { S.cleared += 1; ROOMS[S.cleared + 1] && !q.get("state") && (ROOMS[S.cleared + 1].fresh = true); LAST_PAY[S.view] = 1400; }
    S.wisps += 1400;
    say(SAY.done(room().name));
    render();
    content.querySelector(".wispchip")?.classList.add("bump");
  }
  content.addEventListener("click", e => {
    const t = e.target.closest("[data-clear],[data-mark],[data-u],[data-room],[data-act],[data-off]");
    if (!t) return;
    if (t.dataset.clear) { e.stopPropagation(); const u = S.seats[t.dataset.clear]; for (const k in S.seats) if (S.seats[k] === u) delete S.seats[k]; S.sel = t.dataset.clear; render(); return; }
    if (S.run) return;
    if (t.dataset.act === "go") return go();
    if (t.dataset.act === "again") { S.done = null; say(SAY[LOOK]); render(); return; }
    if (t.dataset.act === "next") { S.done = null; S.view = S.cleared; S.seats = {}; S.bench = []; S.sel = ROOMS[S.view].marks[0]; if (LOOK === "B") S.sel = null; say("the thimble stack! everything's so big in here."); render(); return; }
    if (t.dataset.room) { const i = +t.dataset.room; if (i > S.cleared || S.done) return; S.view = i; S.seats = {}; S.bench = []; S.sel = LOOK === "A" ? ROOMS[i].marks[0] : null; render(); return; }
    if (S.done) return;
    if (t.dataset.mark) { S.sel = S.sel === t.dataset.mark && LOOK === "B" ? null : t.dataset.mark; render(); return; }
    if (t.dataset.off) { S.bench = S.bench.filter(u => u !== +t.dataset.off); render(); return; }
    if (t.dataset.u) {
      const p = byU(+t.dataset.u);
      if (LOOK === "A") {
        if (!S.sel || !fits(p, S.sel)) return;
        for (const k in S.seats) if (k === S.sel) delete S.seats[k];
        S.seats[S.sel] = p.u;
        // a pet fills every other open mark it fits too
        room().marks.forEach(m => { if (S.seats[m] == null && fits(p, m)) S.seats[m] = p.u; });
        S.justFilled = S.sel;
        S.sel = room().marks.find(m => S.seats[m] == null) || null;
      } else {
        const before = room().marks.filter(met);
        if (S.bench.includes(p.u)) S.bench = S.bench.filter(u => u !== p.u);
        else { S.bench.push(p.u); S.justFilled = room().marks.filter(m => met(m) && !before.includes(m)); }
      }
      if (p.you) say("yay! i'll hold the thread.");
      render();
    }
  });

  // screenshot states
  const st = q.get("state");
  if (st === "run" || st === "done") {
    if (LOOK === "A") S.seats["trait:lazy"] = 5; else S.bench.push(5);
    S.sel = null;
    if (st === "run") { S.run = { t: 26 }; say(SAY.run); }
    else { S.run = { t: 60 }; finish(); }
  }
  render();
</script>
</body>
</html>
