<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Errand Upgrades</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/themes.css">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/frame.css">
<style>
  /* the errands tab with coins going somewhere: jobs level up, levels reach goals, idle coins grow */
  .page2 { display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 0; }
  .bar { display: flex; align-items: center; gap: 10px; }
  .income { margin-left: auto; display: flex; align-items: center; gap: 10px; padding: 3px 14px 3px 10px; border-radius: 999px; background: var(--deep); border: 2px solid color-mix(in srgb, var(--cyan) 40%, var(--line)); }
  .income b { font: 400 20px/1 var(--display); color: var(--cyan); font-variant-numeric: tabular-nums; }
  .income span { font-size: 11px; color: var(--muted); line-height: 1.2; }
  .income.bump b { animation: bump .5s var(--ease-out); }
  @keyframes bump { 30% { transform: scale(1.25); color: var(--text); } }
  .buyn { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .muted { color: var(--muted); }
  .small { font-size: 11px; }
  .h { font: 400 20px/1 var(--display); color: var(--pink); margin: 0; }
  .pay { position: absolute; pointer-events: none; font: 400 14px/1 var(--display); color: var(--c, var(--cyan)); animation: rise 1.1s var(--ease-out) forwards; white-space: nowrap; z-index: 5; }
  @keyframes rise { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, -30px); opacity: 0; } }
  .ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .price { display: inline-flex; align-items: center; gap: 4px; color: var(--cyan); font-variant-numeric: tabular-nums; }
  .price.short { color: var(--muted); }
  .price svg { width: 14px; height: 14px; }
  .lv { font: 400 12px/1 var(--display); color: var(--deep); background: var(--gold); padding: 3px 7px 2px; border-radius: 999px; white-space: nowrap; }
  .lv.max { background: var(--mint); }

  /* the goal track: stars along a dotted line, one per goal a job's level reaches */
  .track { position: relative; height: 26px; margin: 0 8px; }
  .track .line { position: absolute; left: 0; right: 0; top: 11px; height: 2px; background: repeating-linear-gradient(to right, var(--line) 0 5px, transparent 5px 9px); }
  .track .done { position: absolute; left: 0; top: 10px; height: 4px; border-radius: 2px; background: var(--c); width: var(--p); transition: width .4s var(--ease-out); }
  .track .star { position: absolute; top: 3px; width: 18px; height: 18px; margin-left: -9px; color: var(--line); }
  .track .star.got { color: var(--gold); }
  .track .star.next { color: var(--c); animation: twinkle 1.6s ease-in-out infinite; }
  @keyframes twinkle { 50% { transform: scale(1.2); } }
  .goal { font-size: 11px; color: var(--muted); }
  .goal b { color: var(--text); font-weight: 400; }

  /* ---------- jobs: the corkboard, now with levels and goals ---------- */
  .cork { display: grid; grid-template-columns: 1fr 190px; gap: 14px; flex: 1; min-height: 0; }
  .board { position: relative; border-radius: var(--r-panel); border: 2px solid var(--line); padding: 16px 16px 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; min-height: 0;
    background-color: color-mix(in srgb, var(--gold) 5%, var(--paper));
    background-image: radial-gradient(circle, color-mix(in srgb, var(--gold) 12%, transparent) 1px, transparent 1.6px), radial-gradient(circle, color-mix(in srgb, var(--pink) 8%, transparent) 1px, transparent 1.6px);
    background-size: 13px 13px, 19px 19px; background-position: 3px 5px, 9px 1px; }
  .jnote { position: relative; padding: 16px 12px 12px; background: var(--raised); border: 2px solid color-mix(in srgb, var(--c) 45%, var(--line)); border-radius: 6px 6px 18px 6px; box-shadow: var(--lift); transform: rotate(var(--tilt)); display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .jnote::before { content: ""; position: absolute; top: -9px; left: 50%; width: 46px; height: 15px; margin-left: -23px; border-radius: 2px; background: color-mix(in srgb, var(--c) 45%, transparent); transform: rotate(-4deg); }
  .jnote .head { display: flex; gap: 8px; align-items: center; color: var(--c); }
  .jnote .head b { font: 400 17px/1.05 var(--display); white-space: nowrap; }
  .jnote > .lv.corner { position: absolute; top: -8px; right: -8px; transform: rotate(8deg); box-shadow: var(--lift); }
  .jnote .head span { display: block; font-size: 11px; color: var(--muted); }
  .jnote .row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); gap: 6px; }
  .jnote .row b { color: var(--c); font-weight: 400; }
  .meter { position: relative; height: 12px; border-radius: 999px; background: var(--deep); border: 2px solid var(--line); }
  .meter i { position: absolute; inset: 0 auto 0 0; width: calc(var(--f) * 100%); background: var(--c); border-radius: 999px; }
  .polas { display: flex; gap: 6px; justify-content: center; margin-top: 2px; }
  .pola { width: 46px; height: 54px; padding: 4px 4px 10px; background: color-mix(in srgb, var(--text) 80%, var(--page)); border-radius: 2px; box-shadow: 0 3px 6px rgba(6, 2, 12, .5); transform: rotate(var(--t, 0deg)); position: relative; flex: none; }
  .pola div { background: var(--deep); height: 100%; display: grid; place-items: center; }
  .pola img { width: 32px; height: 36px; }
  .pola::after { content: ""; position: absolute; top: -4px; left: 50%; width: 7px; height: 7px; margin-left: -3px; border-radius: 50%; background: var(--c, var(--pink)); }
  .pola.empty { background: none; border: 2px dashed color-mix(in srgb, var(--c) 35%, var(--line)); box-shadow: none; display: grid; place-items: center; color: var(--muted); font-size: 16px; }
  .pola.empty::after { display: none; }
  .jnote .plus { margin-top: auto; display: flex; gap: 6px; justify-content: center; }
  .jnote .plus .btn { padding: 2px 10px; }
  .jnote.sealed { border: 2px dashed var(--line); background: color-mix(in srgb, var(--deep) 60%, transparent); box-shadow: none; color: var(--locked); align-items: center; justify-content: center; text-align: center; }
  .jnote.sealed::before { background: color-mix(in srgb, var(--muted) 25%, transparent); }
  .jnote.sealed .soon { color: var(--c); font: 400 15px/1.1 var(--display); }
  .jnote.sealed .meter { width: 80%; }
  .tiers { display: flex; gap: 3px; justify-content: center; font-size: 10px; }
  .tiers span { white-space: nowrap; color: var(--tc); border: 2px solid color-mix(in srgb, var(--tc) 50%, transparent); border-radius: 999px; padding: 0 6px; }
  .shoebox { display: flex; flex-direction: column; gap: 10px; padding: 12px; min-height: 0; }
  .shoebox h3 { margin: 0; font: 400 16px/1 var(--display); color: var(--lilac); }
  .shoebox .polas { justify-content: flex-start; flex-wrap: wrap; }
  .basket { position: relative; padding: 8px 8px 6px; border-radius: 8px 8px 20px 20px; background: color-mix(in srgb, var(--gold) 8%, var(--deep)); border: 2px solid color-mix(in srgb, var(--gold) 35%, var(--line)); display: flex; align-items: center; gap: 8px; font-size: 11px; line-height: 1.3; }
  .basket img { width: 32px; height: 36px; animation: snooze 2.4s ease-in-out infinite; }
  @keyframes snooze { 50% { transform: translateY(2px) scaleY(.95); } }
  .basket .z { position: absolute; left: 30px; top: -6px; color: var(--lilac); font: 400 12px var(--display); animation: zz 2.4s ease-in-out infinite; }
  @keyframes zz { 0% { opacity: 0; transform: translate(0, 4px); } 50% { opacity: 1; } 100% { opacity: 0; transform: translate(6px, -8px); } }
  .since { padding: 8px 10px; font-size: 11px; line-height: 1.35; border-radius: 6px; background: color-mix(in srgb, var(--mint) 10%, var(--raised)); border: 2px solid color-mix(in srgb, var(--mint) 40%, var(--line)); transform: rotate(-1.5deg); margin-top: auto; }
  .since b { color: var(--mint); font-weight: 400; display: block; font-family: var(--display); font-size: 13px; }
  .away .pola { opacity: .45; }

  /* ---------- upgrades A: the pegboard ---------- */
  .ups { display: grid; grid-template-columns: 1fr 220px; gap: 14px; flex: 1; min-height: 0; }
  .peg { position: relative; border-radius: var(--r-panel); border: 2px solid var(--line); padding: 12px 14px 14px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-height: 0; overflow: hidden;
    background-color: color-mix(in srgb, var(--lilac) 4%, var(--paper));
    background-image: radial-gradient(circle, var(--deep) 2px, transparent 2.6px); background-size: 22px 22px; background-position: 11px 11px; }
  .shelf { display: flex; flex-direction: column; gap: 2px; }
  .shelf { gap: 0; }
  .shelf .sign { align-self: flex-start; font: 400 14px/1 var(--display); color: var(--c); padding: 4px 10px 3px; border-radius: 6px; background: var(--raised); border: 2px solid color-mix(in srgb, var(--c) 45%, var(--line)); transform: rotate(-1.5deg); box-shadow: var(--lift); position: relative; z-index: 1; }
  .shelf .sign small { font: 11px var(--body); color: var(--muted); margin-left: 6px; }
  .hooks { display: flex; gap: 10px; padding: 0 2px; }
  .tool { position: relative; flex: none; width: 124px; padding-top: 16px; cursor: pointer; }
  .tool::before { content: ""; position: absolute; top: 0; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--deep); border: 2px solid var(--lilac-seam); }
  .tool::after { content: ""; position: absolute; top: 9px; left: 50%; width: 2px; height: 9px; background: var(--lilac-seam); }
  .tool .tag { position: relative; margin-top: 2px; height: 66px; padding: 8px 8px 7px; border-radius: 8px 8px 8px 8px; background: var(--raised); border: 2px solid color-mix(in srgb, var(--c) 40%, var(--line)); box-shadow: var(--lift); transform: rotate(var(--t)); transform-origin: 50% -12px; transition: transform .25s var(--ease-out); display: flex; flex-direction: column; gap: 4px; }
  .tool:hover .tag { transform: rotate(0deg) translateY(-1px); }
  .tool.on .tag { border: 2px dashed var(--pink); }
  .tool .tag .top2 { display: flex; align-items: center; gap: 6px; color: var(--c); }
  .tool .tag .top2 b { font-weight: 400; font-size: 12px; line-height: 1.15; color: var(--text); flex: 1; }
  .tool .tag .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
  .tool.cant .tag { opacity: .7; }
  .tool.swing .tag { animation: swing .6s var(--ease-out); }
  @keyframes swing { 25% { transform: rotate(8deg); } 55% { transform: rotate(-5deg); } 80% { transform: rotate(2deg); } }
  .tool.hidden .tag { border-style: dashed; background: none; box-shadow: none; color: var(--locked); font-size: 11px; }
  .tool.hidden .tag .top2, .tool.hidden .tag .top2 b { color: var(--locked); }
  .tool.hidden .tag .foot { font-size: 10px; white-space: nowrap; }

  .side { display: flex; flex-direction: column; gap: 9px; padding: 14px 14px 12px; min-height: 0; }
  .side h2 { margin: 0; font: 400 18px/1.1 var(--display); color: var(--c, var(--pink)); display: flex; align-items: center; gap: 8px; }
  .side p { margin: 0; font-size: 12px; line-height: 1.4; }
  .side .gain { color: var(--mint); }
  .side .now { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12px; padding: 8px 10px; border-radius: 10px; background: var(--deep); border: 2px solid var(--line); }
  .side .now dt { color: var(--muted); white-space: nowrap; }
  .side .now dd { margin: 0; text-align: right; white-space: nowrap; }
  .side .now dd em { font-style: normal; color: var(--mint); }
  .side .btn.big { width: 100%; padding: 8px; }
  .side .goals { margin-top: auto; display: flex; flex-direction: column; gap: 4px; padding-top: 8px; border-top: 2px dashed var(--line); }

  /* ---------- upgrades B: the shopping list ---------- */
  .notebook { position: relative; border-radius: 6px 14px 14px 6px; border: 2px solid var(--line); min-height: 0; overflow: hidden; display: flex; flex-direction: column;
    background-color: var(--paper);
    background-image: linear-gradient(to right, transparent 46px, color-mix(in srgb, var(--pink) 35%, transparent) 46px 48px, transparent 48px), repeating-linear-gradient(to bottom, transparent 0 33px, color-mix(in srgb, var(--lilac) 12%, transparent) 33px 35px); background-position: 0 0, 0 6px; }
  .ntabs { display: flex; gap: 4px; padding: 8px 12px 0 56px; background: var(--page); }
  .ntabs button { border: 2px solid var(--line); border-bottom: 0; background: var(--deep); color: var(--muted); padding: 5px 12px 4px; border-radius: 8px 8px 0 0; cursor: pointer; font: 400 13px/1 var(--display); }
  .ntabs button.on { color: var(--c); background: var(--raised); border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
  .lines { padding: 6px 12px 10px 56px; display: flex; flex-direction: column; overflow: auto; min-height: 0; border-top: 2px solid var(--line); }
  .item { display: grid; grid-template-columns: 28px 1fr auto auto; align-items: center; gap: 10px; min-height: 35px; padding: 3px 0; cursor: pointer; border-radius: 6px; }
  .item:hover { background: color-mix(in srgb, var(--raised) 60%, transparent); }
  .item.on { background: var(--raised); outline: 2px dashed var(--pink); outline-offset: -1px; }
  .item .ico { color: var(--c); }
  .item b { font-weight: 400; display: block; font-size: 13px; }
  .item span { font-size: 11px; color: var(--muted); }
  .ticks { display: flex; gap: 3px; }
  .ticks i { width: 7px; height: 12px; border-radius: 2px; border: 2px solid var(--line); }
  .ticks i.on { background: var(--c); border-color: var(--c); }
  .item .btn { padding: 3px 10px; min-width: 82px; }
  .item.hidden { color: var(--locked); cursor: default; }
  .item.hidden:hover { background: none; }
  .scribble { position: absolute; right: 18px; bottom: 12px; font: 400 14px/1.2 var(--display); color: var(--pink); transform: rotate(-4deg); text-align: right; opacity: .85; }

  /* ---------- upgrades C: tools on the back of each note ---------- */
  .jnote.back { gap: 6px; }
  .jnote.back .head b { font-size: 15px; }
  .mini { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 6px; background: var(--deep); border: 2px solid var(--line); cursor: pointer; }
  .mini:hover { border-color: var(--pink-seam); }
  .mini .ico { width: 20px; height: 20px; color: var(--c); }
  .mini b { font-weight: 400; font-size: 11px; line-height: 1.2; display: block; }
  .mini span { display: block; font-size: 10px; line-height: 1.3; color: var(--muted); }
  .mini .price { font-size: 11px; }
  .flipnote { font-size: 11px; color: var(--muted); text-align: center; margin-top: auto; }
  .everyone { display: flex; flex-direction: column; gap: 6px; padding: 12px; min-height: 0; }
  .everyone h3 { margin: 0 0 2px; font: 400 16px/1 var(--display); color: var(--lilac); }

  /* look picker (mockup only) */
  .picker { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
  .picker a { padding: 3px 12px; border-radius: 999px; color: var(--muted); border: 2px solid var(--line); text-decoration: none; font-size: 12px; background: var(--backdrop); }
  .picker a.on { color: var(--pink); border-color: var(--pink); }
</style>
</head>
<body>
<nav class="picker" id="picker"></nav>
<div class="app" data-tab="errands" data-say=""></div>
<script src="../shared/pixel.js"></script>
<script src="../shared/frame.js"></script>
<script>
  // the game's current tabs
  DOODLES.capsule = `<circle cx="12" cy="10" r="6.8"/><path d="M5.3 10 Q12 12.4 18.7 10"/><path d="M7.4 16 L6.6 20.4 Q12 21.2 17.4 20.4 L16.6 16"/>`;
  ICONS.capsule = ICONS.boxes;
  TABS.splice(1, 0, { id: "capsules", label: "machine", icon: "capsule" });
  TABS.splice(TABS.findIndex(t => t.id === "gear"), 1);
  TABS.splice(TABS.findIndex(t => t.id === "boxes"), 1);
  TABS.find(t => t.id === "pets").label = "collectibles";
  TABS.find(t => t.id === "trips").label = "adventures";
  TABS.find(t => t.id === "inventory").label = "workbench";

  const params = new URLSearchParams(location.search);
  const LOOK = params.get("look") || "peg";      // peg | list | flip
  let PAGE = params.get("page") || "upgrades";   // jobs | upgrades
  const STAGE = params.get("stage") || "early";  // early (just opened) | later (a few pets, the stand is open)
  const content = mountFrame();
  const say = t => { document.querySelector(".top .bubble").textContent = t; };
  document.getElementById("picker").innerHTML = [
    ["page=jobs&stage=early", "jobs: just opened"], ["page=jobs&stage=later", "jobs: a bit later"],
    ["look=peg", "upgrades A: pegboard"], ["look=list", "B: shopping list"], ["look=flip", "C: back of the notes"],
  ].map(([k, l]) => {
    const on = k.startsWith("page=jobs") ? PAGE === "jobs" && k.includes(STAGE) : PAGE === "upgrades" && k === `look=${LOOK}`;
    return `<a href="?${k}${k.startsWith("look") ? `&stage=${STAGE}` : ""}" class="${on ? "on" : ""}">${l}</a>`;
  }).join("");

  const num = n => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M" : n >= 1e4 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + "k" : Math.round(n).toLocaleString("en");
  const COIN = `<svg viewBox="0 0 24 24"><path d="M12 3 L19.6 10.4 L12 21.2 L4.4 10.4 Z" fill="var(--cyan)"/><path d="M5 10.4 L19 10.4 M9.2 10.4 L12 4.2 L14.8 10.4 L12 19.8 L9.2 10.4" stroke="var(--page)" stroke-width="1.1" fill="none"/></svg>`;
  const STAR = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5 L14.6 9 L21.5 9.4 L16.2 13.8 L17.9 20.6 L12 16.9 L6.1 20.6 L7.8 13.8 L2.5 9.4 L9.4 9 Z"/></svg>`;
  const pet = id => `<img class="px" src="../assets/pets/${id}.png" alt="">`;

  // upgrade doodles, 24px, crayon strokes
  const ART = {
    nose: `<path d="M6 13 Q6 7 12 7 Q18 7 18 13 Q18 17 12 17 Q6 17 6 13 Z"/><path d="M10 12.5 L10 13.5 M14 12.5 L14 13.5"/><path d="M3 9 L5 10 M21 9 L19 10 M4 5 L6 7" opacity=".7"/>`,
    paw: `<path d="M8 15 Q8 11 12 11 Q16 11 16 15 Q16 19 12 19 Q8 19 8 15 Z"/><circle cx="7" cy="9" r="1.8"/><circle cx="10.5" cy="6" r="1.8"/><circle cx="14" cy="6" r="1.8"/><circle cx="17.3" cy="9" r="1.8"/>`,
    pocket: `<path d="M5 6 L19 6 L18 16 Q12 21 6 16 Z"/><path d="M5 9 L19 9" opacity=".7"/><path d="M12 12 L14 14 L12 16 L10 14 Z"/>`,
    lemon: `<path d="M4 13 Q5 6 12 6 Q19 6 20 13 Q19 19 12 19 Q5 19 4 13 Z"/><path d="M2.5 13 L4 13 M20 13 L21.5 13"/><path d="M9 10 Q11 9 13 10" opacity=".6"/>`,
    sign: `<path d="M4 5 L20 5 L20 13 L4 13 Z"/><path d="M8 13 L8 20 M16 13 L16 20"/><path d="M7 9 L17 9" opacity=".6"/>`,
    cup: `<path d="M6 7 L18 7 L16.5 20 L7.5 20 Z"/><path d="M14 3 L12 12"/><path d="M7 11 L17 11" opacity=".6"/>`,
    snack: `<circle cx="12" cy="12" r="7.5"/><circle cx="9.5" cy="10" r="1"/><circle cx="14" cy="9.5" r="1"/><circle cx="13" cy="14.5" r="1"/><path d="M16.5 6.5 Q19 8 19 10" opacity=".6"/>`,
    nap: `<path d="M16 4 Q10 5 10 11 Q10 17 17 18 Q13 21 9 19.5 Q4 17 4.5 11 Q5 5 12 3.6 Q14.4 3.4 16 4 Z"/><path d="M17 7 L20 7 L17 10 L20 10" opacity=".8"/>`,
    pebble: `<path d="M5 15 Q4 9 11 8.5 Q18 8 19 14 Q19.5 18.5 12 18.5 Q5.5 18.5 5 15 Z"/><path d="M18 2.5 L18.7 4.3 L20.5 5 L18.7 5.7 L18 7.5 L17.3 5.7 L15.5 5 L17.3 4.3 Z"/>`,
    team: `<circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M3.5 19 Q4 14 8 14 Q10.5 14 12 16 Q13.5 14 16 14 Q20 14 20.5 19"/>`,
    q: `<path d="M9 9 Q9 5.5 12.5 5.8 Q16 6.3 15.2 9.6 Q14.4 11.6 12 12.6 L12 14.8"/><circle cx="12" cy="18.5" r=".8" fill="currentColor"/>`,
  };
  const ico = (k, cls = "ico") => `<svg class="${cls}" viewBox="0 0 24 24">${ART[k]}</svg>`;

  // ---------------- the numbers (placeholders; the game would tune them in tools/balance.gd) ----------------
  // A find is worth some CAPSULES, not a fixed number of coins: every machine upgrade makes errands pay
  // more too, so idle coins keep up with the machine for the whole game (and stay well under pulling).
  const CAPSULE = 74;       // what one capsule pays with this machine
  let coins = 28208;
  const LATER = STAGE === "later";
  const JOBS = [
    { id: "coin", name: "coin hunt", brings: "coins", c: "var(--cyan)", doodle: "nose", tilt: -1.4, base: 120, worth: 5,
      does: "sniffing under cushions and flipping pebbles", crew: LATER ? ["mint-blob", "peach-cat", "sky-bunny"] : ["mint-blob"], f: .3,
      goals: [[10, "a lemonade stand opens"], [25, "x2 coins"], [50, "x2 coins"], [100, "x3 coins"]],
      ups: [
        { id: "noses", name: "sniffier noses", art: "nose", what: "+1 capsule's worth a find", lv: LATER ? 9 : 5, max: 0, price: 180, grow: 1.18, fx: "worth", by: 1 },
        { id: "paws", name: "quicker paws", art: "paw", what: "finds come 8% sooner", lv: LATER ? 5 : 2, max: 25, price: 400, grow: 1.3, fx: "speed", by: .08 },
        { id: "pockets", name: "deeper pockets", art: "pocket", what: "1 find in 10 is a big one (x5)", lv: 0, max: 5, price: 2500, grow: 2.2, fx: "big", by: 1, after: 10 },
      ] },
    { id: "lemon", name: "lemonade stand", brings: "tips", c: "var(--pink)", doodle: "lemon", tilt: 1.2, base: 90, worth: 3,
      does: "selling lemonade by the gate. cute pets get bigger tips!", crew: LATER ? ["toxic-cat"] : [], f: .6, rare: true,
      goals: [[10, "x2 tips"], [25, "something new opens…"], [50, "x2 tips"]],
      ups: [
        { id: "lemons", name: "sweeter lemons", art: "lemon", what: "+1 capsule's worth a sale", lv: LATER ? 2 : 0, max: 0, price: 900, grow: 1.2, fx: "worth", by: 1 },
        { id: "sign", name: "a bigger sign", art: "sign", what: "customers come 8% sooner", lv: LATER ? 1 : 0, max: 25, price: 1600, grow: 1.3, fx: "speed", by: .08 },
        { id: "cups", name: "fancy cups", art: "cup", what: "rare pets' tips count double", lv: 0, max: 1, price: 12000, grow: 1, fx: "rare", by: 1, after: 10 },
      ] },
  ];
  const ALL = { id: "all", name: "for everyone", c: "var(--lilac)",
    ups: [
      { id: "snack", name: "snack break", art: "snack", what: "every errand 5% faster", lv: 1, max: 20, price: 1200, grow: 1.45, fx: "all", by: .05 },
      { id: "naps", name: "comfy naps", art: "nap", what: "+1 h at full speed while you're away", lv: 0, max: 8, price: 3000, grow: 1.8, fx: "away", by: 1 },
      { id: "pebbles", name: "shiny pebbles", art: "pebble", what: "errands find shiny ones like the machine", lv: 0, max: 1, price: 8000, grow: 1, fx: "shiny", by: 1, needs: "shiny balls" },
      { id: "team", name: "teamwork", art: "team", what: "each extra pet on a job helps more", lv: 0, max: 3, price: 20000, grow: 3, fx: "team", by: .05 },
    ] };
  const lemonOpen = () => JOBS[0].ups.reduce((n, u) => n + u.lv, 0) >= 10;
  const jobLv = j => j.ups.reduce((n, u) => n + u.lv, 0);
  const upOf = id => [...JOBS.flatMap(j => j.ups.map(u => [u, j])), ...ALL.ups.map(u => [u, ALL])].find(([u]) => u.id === id);
  const cost = (u, n = 1) => { let s = 0; for (let i = 0; i < n; i++) s += Math.round(u.price * Math.pow(u.grow, u.lv + i)); return s; };
  const maxed = u => u.max && u.lv >= u.max;
  const lockedUp = (u, j) => (u.after && jobLv(j) < u.after) || (j.id === "lemon" && !lemonOpen()) || !!u.needs;

  // how fast a job goes and what it pays
  const RARITY = { "mint-blob": 1, "peach-cat": 1, "sky-bunny": 1.5, "toxic-cat": 2.5 };
  function stats(j) {
    const u = id => j.ups.find(x => x.id === id)?.lv || 0;
    const snack = ALL.ups[0].lv * .05, team = .8 + ALL.ups[3].lv * .05;
    const n = j.crew.length;
    const speed = n ? Math.pow(n, team) * (1 + (u("paws") + u("sign")) * .08 + snack) : 0;
    const secs = n ? j.base / speed : 0;
    const goalX = j.goals.filter(([lv, what]) => jobLv(j) >= lv && what.startsWith("x")).reduce((m, [, w]) => m * Number(w[1]), 1);
    const tipX = j.rare ? j.crew.reduce((s, p) => s + (RARITY[p] || 1), 0) / Math.max(1, n) : 1;
    const worth = (j.worth + u("noses") + u("lemons")) * goalX * tipX * (1 + u("pockets") * .4);
    return { secs, pay: Math.round(worth * CAPSULE), perMin: n ? 60 / secs * worth * CAPSULE : 0 };
  }
  const perMin = () => JOBS.filter(j => j.id !== "lemon" || lemonOpen()).reduce((s, j) => s + stats(j).perMin, 0);
  const every = s => s >= 60 ? `every ${Math.floor(s / 60)}m ${String(Math.round(s % 60)).padStart(2, "0")}s` : `every ${Math.max(1, Math.round(s))}s`;

  // the goal track: stars at each goal, filled up to the job's level
  function track(j) {
    const last = j.goals[j.goals.length - 1][0], lv = jobLv(j);
    const pos = x => Math.min(100, Math.sqrt(x / last) * 100);   // early goals get more room
    const next = j.goals.find(([g]) => lv < g);
    return `<div class="track" style="--c:${j.c}; --p:${pos(lv)}%"><div class="line"></div><div class="done"></div>
      ${j.goals.map(([g, what]) => `<span class="star ${lv >= g ? "got" : next && next[0] === g ? "next" : ""}" style="left:${pos(g)}%" title="lv ${g}: ${what}">${STAR}</span>`).join("")}</div>
      <div class="goal">${next ? `lv ${lv}. at lv ${next[0]}: <b>${next[1]}</b>` : `lv ${lv}. every goal reached!`}</div>`;
  }

  let buyN = 1;        // buy 1, 10 or as many as you can
  let picked = "noses";
  let tab = "coin";    // the shopping list's page

  const bar = () => `<div class="bar">
      <div class="seg"><button data-page="jobs" class="${PAGE === "jobs" ? "on" : ""}">jobs</button><button data-page="upgrades" class="${PAGE === "upgrades" ? "on" : ""}">upgrades</button></div>
      ${PAGE === "upgrades" && LOOK !== "flip" ? `<div class="buyn">buy<div class="seg">${[1, 10, "max"].map(n => `<button data-n="${n}" class="${n === buyN ? "on" : ""}">${n === "max" ? "max" : "x" + n}</button>`).join("")}</div></div>` : ""}
      <div class="income" title="what errands bring while you're busy"><b id="rate">◆ ${num(perMin())}</b><span>a minute<br>on errands</span></div>
    </div>`;

  // how many levels a buy button buys right now, and what they cost
  function buyPlan(u) {
    const room = u.max ? u.max - u.lv : Infinity;
    if (buyN === "max") { let n = 0; while (n < room && cost(u, n + 1) <= coins) n++; return { n: Math.max(1, Math.min(n, room)), c: cost(u, Math.max(1, Math.min(n, room))) }; }
    const n = Math.min(buyN, room);
    return { n, c: cost(u, n) };
  }
  const priceTag = u => { if (maxed(u)) return `<span class="lv max">max</span>`; const p = buyPlan(u); return `<span class="price ${p.c > coins ? "short" : ""}">${COIN}${num(p.c)}${p.n > 1 ? ` <small class="muted">x${p.n}</small>` : ""}</span>`; };
  const lvTag = u => `<span class="lv${maxed(u) ? " max" : ""}">lv ${u.lv}${u.max ? `/${u.max}` : ""}</span>`;

  // ---------------- jobs page ----------------
  function jobNote(j) {
    const s = stats(j);
    if (j.id === "lemon" && !lemonOpen()) {
      const lv = jobLv(JOBS[0]);
      return `<div class="jnote sealed" style="--c:${j.c}; --tilt:${j.tilt}deg">${ico("lemon")}<div class="soon">a lemonade stand</div>
        <div class="small">opens at coin hunt lv 10</div><div class="meter" style="--c:var(--cyan); --f:${lv / 10}"><i></i></div><div class="small">${lv} / 10</div></div>`;
    }
    const slots = Array.from({ length: Math.min(3, j.crew.length + 1) }, (_, i) => j.crew[i]
      ? `<div class="pola" style="--t:${[-4, 3, -2][i]}deg; --c:${j.c}"><div>${pet(j.crew[i])}</div></div>`
      : `<div class="pola empty" style="--c:${j.c}">+</div>`).join("");
    return `<div class="jnote" data-job="${j.id}" style="--c:${j.c}; --tilt:${j.tilt}deg">
      <span class="lv corner">lv ${jobLv(j)}</span><div class="head">${ico(j.doodle)}<div><b>${j.name}</b><span>brings ${j.brings}</span></div></div>
      <div class="meter jobwrap" style="--c:${j.c}; --f:${j.f}"><i></i></div>
      <div class="row"><span><b>◆${num(s.pay)}</b> a ${j.rare ? "sale" : "find"}</span><span>${j.crew.length ? every(s.secs) : "nobody on it"}</span></div>
      ${j.rare ? `<div class="tiers"><span style="--tc:var(--tier-common)">common x1</span><span style="--tc:var(--tier-rare)">rare x2.5</span><span style="--tc:var(--tier-legendary)">legend x8</span></div>` : ""}
      ${track(j)}
      <div class="polas">${slots}</div>
      <div class="plus"><button class="btn">−</button><button class="btn primary">+ a pet</button></div>
    </div>`;
  }
  function renderJobs() {
    const resting = LATER ? ["lilac-cat"] : [];
    content.innerHTML = `<div class="page2">${bar()}<div class="cork">
      <div class="board">
        ${JOBS.map(jobNote).join("")}
        <div class="jnote sealed" style="--tilt:2deg">${ico("q")}<div>something behind the shed…</div><div class="small">keep finding things on adventures</div></div>
      </div>
      <div class="shoebox sticker">
        ${LATER ? "" : `<div class="basket"><span class="z">z</span>${pet("mint-blob")}<div>mint blob came home asleep in the basket. it's on the coin hunt now!</div></div>`}
        <h3>resting</h3>
        <div class="polas">${resting.map((p, i) => `<div class="pola" style="--t:${[3, -3][i % 2]}deg"><div>${pet(p)}</div></div>`).join("") || `<span class="small muted">everyone's busy!</span>`}</div>
        <h3>on adventures</h3>
        <div class="polas away"><div class="pola" style="--t:-2deg; --c:var(--muted)"><div>${pet(LATER ? "peach-bear" : "peach-cat")}</div></div></div>
        <div class="since"><b>while you were away</b>◆ ${num(perMin() * 60 * 3.2)} in 3 h</div>
      </div>
    </div></div>`;
    say(LATER ? "the lemonade stand is open! toxic cat sells the most. it's the rarest. and the loudest." : "a pet was asleep in the basket! it wanted a job, so it's sniffing for coins.");
  }

  // ---------------- upgrades A: pegboard ----------------
  function tool(u, j, i) {
    if (lockedUp(u, j) && !(j.id === "lemon" && !lemonOpen())) {
      return `<div class="tool hidden" style="--c:${j.c}" data-up="${u.id}"><div class="tag" style="--t:${[2, -2, 1][i]}deg"><div class="top2">${ico(u.art)}<b>${u.name}</b></div><div class="foot">${u.needs ? `needs ${u.needs}` : `at lv ${u.after}`}</div></div></div>`;
    }
    return `<div class="tool${u.id === picked ? " on" : ""}${cost(u) > coins || maxed(u) ? " cant" : ""}" style="--c:${j.c}" data-up="${u.id}">
      <div class="tag" style="--t:${[-3, 2.5, -1.5, 3][i]}deg"><div class="top2">${ico(u.art)}<b>${u.name}</b></div>
      <div class="foot">${lvTag(u)}${priceTag(u)}</div></div></div>`;
  }
  function shelf(j) {
    if (j.id === "lemon" && !lemonOpen()) return `<div class="shelf" style="--c:${j.c}"><div class="sign" style="opacity:.6">${j.name}<small>opens at coin hunt lv 10</small></div>
      <div class="hooks">${j.ups.map((u, i) => `<div class="tool hidden"><div class="tag" style="--t:${[2, -2, 1][i]}deg">${ico(u.art)}<div>???</div></div></div>`).join("")}</div></div>`;
    return `<div class="shelf" style="--c:${j.c}"><div class="sign">${j.name}${j.id === "all" ? "" : `<small>lv ${jobLv(j)}</small>`}</div><div class="hooks">${j.ups.map((u, i) => tool(u, j, i)).join("")}</div></div>`;
  }
  function side() {
    const [u, j] = upOf(picked);
    const s0 = perMin();
    const p = buyPlan(u);
    u.lv += p.n; const s1 = perMin(); u.lv -= p.n;
    const job = j.id === "all" ? null : j;
    const locked = lockedUp(u, j);
    return `<div class="side sticker" style="--c:${j.c}">
      <h2>${ico(u.art)}${u.name}</h2>
      <p>${u.what}.</p>
      <dl class="now"><dt>level</dt><dd>${u.lv}${u.max ? ` of ${u.max}` : ""}</dd>
        ${u.fx === "away" ? `<dt>full speed away</dt><dd>${8 + u.lv} h <em>→ ${8 + u.lv + p.n} h</em></dd>` : `<dt>a minute</dt><dd>◆ ${num(s0)}${s1 > s0 ? ` <em>→ ${num(s1)}</em>` : ""}</dd>`}</dl>
      <button class="btn primary big" data-buy ${maxed(u) || locked || p.c > coins ? "disabled" : ""}>${maxed(u) ? "all done!" : locked ? "not yet" : `buy ${p.n > 1 ? p.n + " levels" : "it"} for ◆ ${num(p.c)}`}</button>
      ${job ? `<div class="goals"><div class="small muted">${job.name} goals</div>${track(job)}</div>`
        : `<div class="goals"><div class="small muted">goals</div>${track(JOBS[0])}</div>`}
    </div>`;
  }
  function renderPeg() {
    content.innerHTML = `<div class="page2">${bar()}<div class="ups">
      <div class="peg">${[...JOBS, ALL].map(shelf).join("")}</div>
      ${side()}
    </div></div>`;
  }

  // ---------------- upgrades B: the shopping list ----------------
  function renderList() {
    const pages = [...JOBS, ALL];
    const j = pages.find(p => p.id === tab);
    const closed = j.id === "lemon" && !lemonOpen();
    const rows = closed ? `<div class="item hidden">${ico("lemon")}<div><b>the lemonade stand isn't open yet</b><span>it opens when the coin hunt reaches lv 10</span></div><span></span><span></span></div>`
      : j.ups.map(u => {
      const locked = lockedUp(u, j);
      const ticks = u.max && u.max <= 10 ? `<div class="ticks">${Array.from({ length: u.max }, (_, i) => `<i class="${i < u.lv ? "on" : ""}"></i>`).join("")}</div>` : lvTag(u);
      if (locked) return `<div class="item hidden">${ico(u.art)}<div><b>${u.name}</b><span>${u.needs ? `needs ${u.needs}` : `at ${j.name} lv ${u.after}`}</span></div><span></span><span class="small">not yet</span></div>`;
      return `<div class="item${u.id === picked ? " on" : ""}" data-up="${u.id}">${ico(u.art)}<div><b>${u.name}</b><span>${u.what}</span></div>${ticks}
        <button class="btn" data-buy="${u.id}" ${maxed(u) || cost(u) > coins ? "disabled" : ""}>${maxed(u) ? "done ♡" : priceTag(u)}</button></div>`;
    }).join("");
    content.innerHTML = `<div class="page2">${bar()}<div class="ups">
      <div class="notebook" style="--c:${j.c}">
        <div class="ntabs">${pages.map(p => `<button data-tab="${p.id}" class="${p.id === tab ? "on" : ""}" style="--c:${p.c}">${p.id === "all" ? "everyone" : p.name}</button>`).join("")}</div>
        <div class="lines">${rows}${closed ? "" : `<div style="padding: 10px 0 0">${j.id === "all" ? "" : track(j)}</div>`}</div>
        <div class="scribble">${j.id === "all" ? "for every job ♡" : "things to get for<br>the " + j.name + "!"}</div>
      </div>
      ${side()}
    </div></div>`;
  }

  // ---------------- upgrades C: on the back of each note ----------------
  function backNote(j) {
    if (j.id === "lemon" && !lemonOpen()) return jobNote(j);
    return `<div class="jnote back" style="--c:${j.c}; --tilt:${j.tilt}deg">
      <span class="lv corner">lv ${jobLv(j)}</span><div class="head">${ico(j.doodle)}<div><b>${j.name}</b><span>its tools</span></div></div>
      ${j.ups.map(u => lockedUp(u, j) ? `<div class="mini" style="opacity:.55; cursor:default">${ico(u.art)}<div><b>${u.name}</b><span>at lv ${u.after}</span></div><span></span></div>`
        : `<div class="mini" data-buy="${u.id}" title="${u.what}">${ico(u.art)}<div><b>${u.name}</b><span>lv ${u.lv}${u.max ? `/${u.max}` : ""}</span></div>${maxed(u) ? `<span class="lv max">max</span>` : priceTag(u)}</div>`).join("")}
      ${track(j)}
      <div class="flipnote">tap a tool to buy a level</div>
    </div>`;
  }
  function renderFlip() {
    content.innerHTML = `<div class="page2">${bar()}<div class="cork">
      <div class="board">${JOBS.map(backNote).join("")}
        <div class="jnote sealed" style="--tilt:2deg">${ico("q")}<div>something behind the shed…</div></div></div>
      <div class="everyone sticker" style="--c:var(--lilac)"><h3>for everyone</h3>
        ${ALL.ups.map(u => u.needs ? `<div class="mini" style="opacity:.55; cursor:default">${ico(u.art)}<div><b>${u.name}</b><span>needs ${u.needs}</span></div><span></span></div>`
          : `<div class="mini" data-buy="${u.id}" title="${u.what}">${ico(u.art)}<div><b>${u.name}</b><span>${u.what}</span></div>${maxed(u) ? `<span class="lv max">max</span>` : priceTag(u)}</div>`).join("")}
      </div>
    </div></div>`;
  }

  // ---------------- buying ----------------
  const LINES = {
    noses: ["sniff sniff! i can smell a coin from here.", "our noses are SO good now."],
    paws: ["zoom zoom! quicker paws!", "tiny shoes for running! they're so fast."],
    pockets: ["deeper pockets! more room for treasure."],
    lemons: ["sweeter lemons! people LOVE us now."],
    sign: ["a bigger sign! everyone can see us from the road!"],
    snack: ["snack break! everyone works better after a cookie."],
    naps: ["comfy naps! we'll keep working all night. well, most of it."],
    team: ["teamwork! we hold paws and dig together now."],
  };
  function buy(id) {
    const [u, j] = upOf(id);
    const p = buyPlan(u);
    if (maxed(u) || lockedUp(u, j) || p.c > coins) { say(maxed(u) ? "that one's as good as it gets!" : "we need a few more coins for that one."); return; }
    const before = lemonOpen();
    const reached = j.goals ? j.goals.filter(([g]) => jobLv(j) < g && jobLv(j) + p.n >= g) : [];
    coins -= p.c; u.lv += p.n;
    document.querySelector(".chip.coins").lastChild.textContent = coins.toLocaleString("en");
    render();
    const rate = document.querySelector(".income"); rate.classList.remove("bump"); void rate.offsetWidth; rate.classList.add("bump");
    document.querySelector(`[data-up="${id}"]`)?.classList.add("swing");
    if (!before && lemonOpen()) say("the coin hunt found a lemonade stand by the gate! can we open it? please?");
    else if (reached.length) say(`goal reached! ${reached[reached.length - 1][1]}! ♡`);
    else { const l = LINES[id] || ["ooh, shiny!"]; say(l[Math.floor(Math.random() * l.length)]); }
  }

  function render() {
    if (PAGE === "jobs") renderJobs();
    else ({ peg: renderPeg, list: renderList, flip: renderFlip })[LOOK]();
    paintIcons(content);
    content.querySelectorAll("[data-page]").forEach(b => b.addEventListener("click", () => { PAGE = b.dataset.page; render(); }));
    content.querySelectorAll("[data-n]").forEach(b => b.addEventListener("click", () => { buyN = b.dataset.n === "max" ? "max" : Number(b.dataset.n); render(); }));
    content.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => { tab = b.dataset.tab; const [first] = [...JOBS, ALL].find(p => p.id === tab).ups; picked = first.id; render(); }));
    content.querySelectorAll("[data-up]").forEach(el => el.addEventListener("click", e => {
      if (el.classList.contains("hidden")) return;
      if (picked === el.dataset.up && LOOK === "peg") return buy(picked);   // tap a picked tool again to buy it
      picked = el.dataset.up; render();
      const [u] = upOf(picked); say(`${u.name}: ${u.what}.`);
    }));
    content.querySelectorAll("[data-buy]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); buy(el.dataset.buy || picked); }));
  }

  // meters fill and pay on the jobs page
  let last = performance.now();
  function tick(now) {
    const dt = (now - last) / 1000 * 8; last = now;
    if (PAGE === "jobs") for (const j of JOBS) {
      if (!j.crew.length || (j.id === "lemon" && !lemonOpen())) continue;
      const s = stats(j);
      j.f += dt / s.secs;
      if (j.f >= 1) {
        j.f -= Math.floor(j.f); coins += s.pay;
        document.querySelector(".chip.coins").lastChild.textContent = coins.toLocaleString("en");
        const m = document.querySelector(`[data-job="${j.id}"] .jobwrap`);
        if (m) { const p = document.createElement("span"); p.className = "pay"; p.style.setProperty("--c", j.c); p.textContent = `+${num(s.pay)}`; p.style.left = "50%"; p.style.top = "-8px"; m.appendChild(p); setTimeout(() => p.remove(), 1200); }
      }
      document.querySelectorAll(`[data-job="${j.id}"] .meter`).forEach(el => el.style.setProperty("--f", j.f.toFixed(3)));
    }
    requestAnimationFrame(tick);
  }

  if (params.get("pick")) picked = params.get("pick");
  if (params.get("tab")) tab = params.get("tab");
  if (PAGE === "upgrades") say("coins can buy the pets better tools! then they find more while you're busy.");
  document.querySelector(".chip.coins").lastChild.textContent = coins.toLocaleString("en");
  render();
  applyLook(loadLook());
  requestAnimationFrame(tick);
</script>
</body>
</html>
