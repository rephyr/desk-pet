<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pets Shelves</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/themes.css">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/frame.css">
<style>
  /* collectibles tab, pets page, once there are thousands: a shelf per rarity with a count (the herd),
     tap one to open it, favourites and the best ones pinned on top, the room cap always in sight. */
  body { align-content: center; gap: 10px; padding: 10px 0; }
  .mock-head { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .picker { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .picker a { padding: 3px 12px; border-radius: 999px; color: var(--muted); border: 2px solid var(--line); text-decoration: none; font-size: 12px; background: var(--backdrop); white-space: nowrap; }
  .picker a.on { color: var(--pink); border-color: var(--pink); }
  .picker i { width: 10px; }
  .caption { font-size: 12px; color: var(--muted); }
  .caption b { color: var(--text); font: 400 14px/1 var(--display); margin-right: 8px; }

  /* one more tab: squeeze the spine a little so settings still fits (as on the automation tab) */
  .spine { gap: 2px; }
  .spine .tab { padding: 4px 0 2px; font-size: 10px; letter-spacing: -.2px; }
  .moon { margin-bottom: 2px; }

  .wrap { display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 0; }
  .bar { display: flex; align-items: center; gap: 10px; min-height: 30px; }
  .bar .seg button { padding: 4px 12px; font-size: 12px; }
  .bar .right { margin-left: auto; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  .px.flip { transform: scaleX(-1); }

  /* ---- a small card (pinned pets) ---- */
  .mini { position: relative; flex: none; width: 76px; padding: 6px 2px 5px; display: flex; flex-direction: column; align-items: center;
    background: var(--raised); border: 2px solid var(--tier); border-radius: var(--r-lg); box-shadow: var(--lift); cursor: pointer;
    transform: rotate(var(--t, 0deg)); transition: transform .15s var(--ease-out); }
  .mini:hover { transform: translateY(-3px) rotate(0deg); }
  .mini img { width: 32px; height: 36px; }
  .mini .nm { margin-top: 3px; font-size: 10px; line-height: 1.2; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70px; }
  .mini .tr { font-size: 10px; line-height: 1.2; color: var(--tier); white-space: nowrap; }
  .mini .tr em { font-style: normal; color: var(--gold); }
  .mini.glow { box-shadow: var(--lift), 0 0 14px color-mix(in srgb, var(--tier) 45%, transparent); }
  .badge { position: absolute; top: -7px; right: -6px; line-height: 0; }
  .badge.moon2 { top: -8px; left: -6px; right: auto; width: 16px; height: 16px; border-radius: 50%; background: var(--deep); border: 2px solid var(--line); display: grid; place-items: center; }
  .badge.moon2 svg { width: 10px; height: 10px; }
  .badge.newp { top: -8px; left: -6px; right: auto; padding: 1px 5px; border-radius: 999px; background: var(--gold); color: var(--deep); font-size: 10px; line-height: 1.3; transform: rotate(-8deg); }

  /* ---- a pile of tiny pets (the herd) ---- */
  .pile { position: relative; flex: none; z-index: 0; }
  .pile img { position: absolute; width: 16px; height: 18px; }

  /* ================= look A: the bookcase ================= */
  .cushion { position: relative; display: flex; gap: 10px; align-items: flex-end; padding: 12px 14px 10px; border-radius: var(--r-panel);
    background: color-mix(in srgb, var(--pink) 7%, var(--raised)); border: 2px solid var(--pink-seam); box-shadow: var(--lift); }
  .cushion::before { content: ""; position: absolute; inset: 4px; border: 2px dashed color-mix(in srgb, var(--pink) 30%, transparent); border-radius: 10px; pointer-events: none; }
  .cushion .pinhead { position: absolute; top: -8px; left: 18px; color: var(--pink); }
  .case { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 4px 12px 8px; border-radius: var(--r-panel);
    background: var(--paper); border: 2px solid var(--lilac-seam); box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--lilac) 8%, var(--paper)); }
  .plank { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: 138px 1fr; align-items: end; gap: 12px; padding: 0 6px 0 4px; cursor: pointer; }
  .plank::after { content: ""; position: absolute; left: -6px; right: -6px; bottom: 0; height: 7px; border-radius: 3px;
    background: color-mix(in srgb, var(--lilac) 22%, var(--page)); border: 2px solid var(--lilac-seam); }
  .plank:hover::after { border-color: var(--pink); }
  .plank .tag { align-self: center; justify-self: start; margin-top: 2px; padding: 3px 10px 3px; border-radius: 6px; background: var(--raised);
    border: 2px solid color-mix(in srgb, var(--tier) 55%, var(--line)); transform: rotate(var(--t)); box-shadow: var(--lift); line-height: 1.1; }
  .plank .tag span { display: block; font-size: 10px; color: var(--tier); }
  .plank .tag b { display: block; font: 400 17px/1.05 var(--display); color: var(--text); }
  .plank .stand { display: flex; align-items: flex-end; gap: 4px; padding-bottom: 7px; min-width: 0; overflow: hidden; }
  .plank .stand > img { width: 32px; height: 36px; flex: none; }
  .plank .stand .pile { margin-left: 8px; }
  .plank .shine { margin-left: auto; align-self: center; font-size: 11px; color: var(--gold); white-space: nowrap; }
  .roompill { display: flex; align-items: center; gap: 8px; padding: 3px 12px 3px 8px; border-radius: 999px; background: var(--deep); border: 2px solid color-mix(in srgb, var(--lilac) 35%, var(--line)); color: var(--lilac); }
  .roompill .meter { width: 90px; height: 10px; border-radius: 999px; background: var(--raised); border: 2px solid var(--line); overflow: hidden; }
  .roompill .meter i { display: block; height: 100%; background: var(--lilac); border-radius: 999px; }
  .roompill b { font: 400 14px/1 var(--display); color: var(--text); font-variant-numeric: tabular-nums; }
  .roompill b small { font: 11px var(--body); color: var(--muted); }
  .full .roompill { border-color: var(--pink); color: var(--pink); animation: nudge 2.6s ease-in-out infinite; }
  .full .roompill .meter i { background: var(--pink); }
  @keyframes nudge { 0%, 84%, 100% { transform: none; } 88% { transform: rotate(-2deg); } 92% { transform: rotate(2deg); } 96% { transform: rotate(-1deg); } }

  /* ================= look B: the jars ================= */
  .bunting { position: relative; height: 104px; flex: none; }
  .bunting svg.string { position: absolute; left: 0; top: 0; }
  .bunting .pola { position: absolute; width: 74px; padding: 5px 5px 4px; background: color-mix(in srgb, var(--text) 82%, var(--page)); border-radius: 2px;
    box-shadow: 0 3px 6px rgba(6, 2, 12, .5); transform: rotate(var(--t)); transform-origin: 50% 0; cursor: pointer; transition: transform .2s var(--ease-out); }
  .bunting .pola:hover { transform: rotate(0deg); }
  .bunting .pola .ph { height: 44px; background: var(--deep); display: grid; place-items: center; border-bottom: 3px solid var(--tier); }
  .bunting .pola.glow .ph { box-shadow: inset 0 0 12px color-mix(in srgb, var(--tier) 55%, transparent); }
  .bunting .pola img { width: 32px; height: 36px; }
  .bunting .pola .cap { margin-top: 3px; font-size: 10px; line-height: 1.15; color: var(--page); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bunting .pola::before { content: ""; position: absolute; top: -9px; left: 50%; width: 8px; height: 15px; margin-left: -4px; border-radius: 2px; background: var(--tier); border: 2px solid var(--deep); }
  .bunting .pola .badge { top: 2px; right: 2px; }
  .counter { flex: 1; min-height: 0; position: relative; display: flex; align-items: flex-end; justify-content: center; gap: 12px; padding: 0 10px 14px; }
  .counter::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 14px; border-radius: 4px;
    background: color-mix(in srgb, var(--lilac) 22%, var(--page)); border: 2px solid var(--lilac-seam); }
  .jar { position: relative; width: 116px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform .15s var(--ease-out); }
  .jar:hover { transform: translateY(-3px); }
  .jar .lid { width: 84px; height: 16px; border-radius: 6px 6px 3px 3px; background: color-mix(in srgb, var(--tier) 40%, var(--page)); border: 2px solid var(--tier); position: relative; z-index: 1; }
  .jar .neck { width: 76px; height: 8px; border-left: 2px solid var(--lilac-seam); border-right: 2px solid var(--lilac-seam); background: color-mix(in srgb, var(--lilac) 5%, var(--page)); }
  .jar .glass { position: relative; width: 116px; border: 2px solid var(--lilac-seam); border-radius: 18px 18px 22px 22px; background: color-mix(in srgb, var(--lilac) 5%, var(--page)); overflow: hidden; }
  .jar:hover .glass { border-color: var(--pink); }
  .jar .glass::before { content: ""; position: absolute; left: 10px; top: 14px; width: 4px; height: 44%; border-radius: 2px; background: var(--text); opacity: .12; z-index: 2; }
  .jar .glass .pile { position: absolute; left: 2px; bottom: 3px; }
  .jar .label { position: absolute; left: 50%; bottom: 26%; transform: translateX(-50%) rotate(var(--t)); z-index: 3; width: 92px; padding: 4px 4px 3px; text-align: center; line-height: 1.1;
    background: var(--raised); border: 2px solid color-mix(in srgb, var(--tier) 60%, var(--line)); border-radius: 6px; box-shadow: var(--lift); }
  .jar .label span { display: block; font-size: 10px; color: var(--tier); }
  .jar .label b { display: block; font: 400 17px/1.1 var(--display); color: var(--text); white-space: nowrap; }
  .paws { display: flex; align-items: center; gap: 3px; padding: 3px 10px 3px 8px; border-radius: 999px; background: var(--deep); border: 2px solid var(--line); }
  .paws svg { width: 15px; height: 15px; }
  .paws .p { fill: none; stroke: var(--muted-seam); stroke-width: 1.6; }
  .paws .p.on { fill: var(--lilac); stroke: var(--lilac); }
  .paws .p.half { fill: color-mix(in srgb, var(--lilac) 40%, transparent); stroke: var(--lilac); }
  .paws small { margin-left: 5px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .full .paws .p.on { fill: var(--pink); stroke: var(--pink); }
  .full .paws { border-color: var(--pink-seam); animation: nudge 2.6s ease-in-out infinite; }

  /* ================= look C: the drawers ================= */
  .ontop { position: relative; display: flex; gap: 10px; align-items: flex-end; padding: 0 14px; height: 96px; flex: none; }
  .cabinet { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px 10px 8px; margin-top: -6px; border-radius: 10px 10px var(--r-panel) var(--r-panel);
    background: color-mix(in srgb, var(--lilac) 14%, var(--page)); border: 2px solid var(--lilac-seam); box-shadow: var(--lift); }
  .drawers { flex: 1; min-height: 0; display: flex; flex-wrap: wrap; gap: 24px 10px; padding-top: 18px; align-content: stretch; }
  .drawer { position: relative; flex: 1 1 30%; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 8px 6px;
    background: var(--raised); border: 2px solid var(--lilac-seam); border-radius: 8px; box-shadow: 0 3px 0 var(--deep); cursor: pointer; transition: transform .15s var(--ease-out); }
  .drawer:hover { transform: translateY(2px); border-color: var(--pink); }
  .drawer::before { content: ""; position: absolute; inset: 6px; border: 2px dashed var(--line); border-radius: 5px; pointer-events: none; }
  .drawer .peek { position: absolute; left: 12px; right: 12px; top: -20px; height: 20px; overflow: hidden; display: flex; justify-content: center; gap: 2px; pointer-events: none; }
  .drawer .peek img { width: 32px; height: 36px; flex: none; }
  .drawer .holder { padding: 2px 12px 1px; border-radius: 4px; background: var(--deep); border: 2px solid color-mix(in srgb, var(--tier) 55%, var(--line)); font-size: 11px; color: var(--tier); }
  .drawer b { font: 400 24px/1.1 var(--display); color: var(--text); font-variant-numeric: tabular-nums; }
  .drawer .sh { font-size: 11px; color: var(--gold); min-height: 15px; }
  .drawer .handle { width: 44px; height: 9px; border-radius: 999px; border: 2px solid var(--lilac-seam); background: var(--deep); margin-top: 2px; }
  .strip { display: flex; align-items: center; gap: 8px; }
  .strip .bar2 { flex: 1; height: 14px; display: flex; border-radius: 999px; background: var(--deep); border: 2px solid var(--line); overflow: hidden; }
  .strip .bar2 i { height: 100%; }
  .strip .bar2 i + i { box-shadow: inset 2px 0 0 var(--deep); }
  .strip b { font: 400 13px/1 var(--display); color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .strip b small { font: 11px var(--body); color: var(--muted); }
  .strip .home { color: var(--lilac); line-height: 0; }
  .full .strip .bar2 { border-color: var(--pink); animation: nudge 2.6s ease-in-out infinite; }

  /* ================= a shelf, opened (every look) ================= */
  .opened { display: grid; grid-template-columns: 1fr 236px; gap: 14px; flex: 1; min-height: 0; }
  .shelfbox { display: flex; flex-direction: column; gap: 8px; min-height: 0; padding: 10px 10px 8px; border-radius: var(--r-panel); background: var(--paper); border: 2px solid var(--lilac-seam); }
  .open-head { display: flex; align-items: center; gap: 10px; }
  .open-head .link { color: var(--muted); font-size: 12px; }
  .open-head .link:hover { color: var(--pink); }
  .open-head .tn { font: 400 20px/1 var(--display); color: var(--tier); }
  .open-head .tc { font: 400 20px/1 var(--display); color: var(--text); font-variant-numeric: tabular-nums; }
  .herd { display: flex; gap: 10px; }
  .herdchip { display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 8px; border-radius: 10px; background: var(--deep); border: 2px solid var(--line); }
  .herdchip span { font-size: 11px; color: var(--muted); }
  .herdchip span.sh { color: var(--gold); }
  .herdchip b { font: 400 16px/1 var(--display); color: var(--text); font-variant-numeric: tabular-nums; }
  .cards { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 12px 10px; padding: 8px 6px 10px 4px; align-content: start;
    scrollbar-width: thin; scrollbar-color: var(--lilac-seam) transparent; }
  .cards .mini { width: auto; }
  .cards hr { grid-column: 1 / -1; }
  .mini.on { outline: 2px solid var(--pink); outline-offset: 3px; }
  .opened .detail { padding: 12px 14px 12px; }
  .opened .detail img { width: 64px; height: 72px; }
  .opened .detail h2 { font-size: 18px; margin-top: 6px; }
  .opened .detail dl { margin: 8px 0; gap: 1px 10px; }
  .opened .detail .row2 { display: flex; gap: 6px; width: 100%; margin-top: auto; }
  .opened .detail .row2 .btn { margin: 0; }
  .opened .detail .row2 .fav { width: auto; flex: none; padding: 6px 10px; }
  .opened .detail .row2 .fav.on { border-color: var(--pink); }
  .opened .detail .fin { font-size: 11px; color: var(--gold); }
  /* the opened shelf keeps its look's flavour */
  .open-a .shelfbox { box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--lilac) 8%, var(--paper)); }
  .open-b .shelfbox { border-radius: 18px 18px 26px 26px; border-top: 14px solid color-mix(in srgb, var(--tier) 40%, var(--page)); }
  .open-c .shelfbox { background: var(--deep); border-bottom-width: 18px; border-color: var(--lilac-seam); border-radius: 8px 8px 12px 12px; box-shadow: inset 0 4px 0 rgba(6, 2, 12, .6); }
</style>
</head>
<body>
<div class="mock-head">
  <nav class="picker" id="picker"></nav>
  <div class="caption" id="caption"></div>
</div>
<div class="app" data-tab="pets" data-say=""></div>
<script src="../shared/pixel.js"></script>
<script src="../shared/frame.js"></script>
<script>
  // the game's current tabs (as on the automation mockup)
  DOODLES.capsule = `<circle cx="12" cy="10" r="6.8"/><path d="M5.3 10 Q12 12.4 18.7 10"/><path d="M7.4 16 L6.6 20.4 Q12 21.2 17.4 20.4 L16.6 16"/>`;
  ICONS.capsule = ICONS.boxes;
  DOODLES.automation = `<circle cx="12" cy="12" r="2.6"/><path d="M12 5.2 Q16.8 5.4 18.6 9.6 Q19.4 14.6 15.6 17.8 Q11 20.4 6.8 17.4 Q3.9 13.6 5.8 8.6 Q7.8 5.4 12 5.2 Z"/><path d="M12 2.6 L12 5.2 M12 18.8 L12 21.4 M2.6 12 L5.2 12 M18.8 12 L21.4 12 M5.4 5.4 L7.1 7.1 M16.9 16.9 L18.6 18.6 M5.4 18.6 L7.1 16.9 M16.9 7.1 L18.6 5.4"/>`;
  ICONS.automation = ICONS.settings;
  TABS.splice(1, 0, { id: "capsules", label: "machine", icon: "capsule" });
  TABS.splice(TABS.findIndex(t => t.id === "gear"), 1);
  TABS.find(t => t.id === "pets").label = "collectibles";
  TABS.find(t => t.id === "trips").label = "adventures";
  TABS.find(t => t.id === "inventory").label = "workbench";
  TABS.find(t => t.id === "boxes").news = false;
  TABS.splice(TABS.findIndex(t => t.id === "errands") + 1, 0, { id: "automation", label: "automation", icon: "automation" });

  const params = new URLSearchParams(location.search);
  const LOOK = params.get("look") || "a";        // a bookcase | b jars | c drawers
  const STAGE = params.get("n") || "near";       // near (room nearly full) | full | later (big numbers, bigger room)
  let OPEN = params.get("open") || "";           // a tier id: that shelf is open
  const content = mountFrame();
  const say = t => { document.querySelector(".top .bubble").textContent = t; };

  const LOOKS = {
    a: ["Look A: the bookcase", "a plank per rarity: the newest stand on it, the rest pile up. The room is a pill with a meter."],
    b: ["Look B: the jars", "a candy jar per rarity, filled with tiny pets; favourites hang on a string. The room is ten paw prints."],
    c: ["Look C: the drawers", "a drawer per rarity, pets peeking over the edge; favourites sit on top. The room is a strip split by rarity."],
  };
  const qs = o => { const p = new URLSearchParams({ look: LOOK, n: STAGE, ...o }); for (const [k, v] of [...p]) if (!v) p.delete(k); return "?" + p; };
  document.getElementById("picker").innerHTML =
    [["a", "A: bookcase"], ["b", "B: jars"], ["c", "C: drawers"]].map(([k, l]) => `<a href="${qs({ look: k, open: OPEN })}" class="${LOOK === k ? "on" : ""}">${l}</a>`).join("") + "<i></i>" +
    [["near", "room nearly full"], ["full", "room full"], ["later", "much later"]].map(([k, l]) => `<a href="${qs({ n: k, open: OPEN })}" class="${STAGE === k ? "on" : ""}">${l}</a>`).join("") + "<i></i>" +
    `<a href="${qs({ open: OPEN ? "" : "rare" })}" class="${OPEN ? "on" : ""}">a shelf opened</a>`;
  document.getElementById("caption").innerHTML = `<b>${LOOKS[LOOK][0]}</b>${LOOKS[LOOK][1]}`;

  // ---------------- numbers (placeholders) ----------------
  const TIERS = ["common", "uncommon", "rare", "epic", "legendary", "mythic"];
  const SPR = { common: ["peach-cat", "lilac-cat", "mint-blob"], uncommon: ["mint-bear", "peach-bear"], rare: ["sky-bunny", "midnight-bear", "lilac-blob"],
    epic: ["bubblegum-fox", "toxic-cat"], legendary: ["gold-dragon"], mythic: ["abyss-void"] };
  // per shelf: [plain, shiny] folded into counts; holo and up are always cards
  const NUMS = {
    near:  { cap: 500,   c: { common: [270, 48], uncommon: [104, 17], rare: [38, 6], epic: [10, 1], legendary: [2, 0] } },
    full:  { cap: 500,   c: { common: [272, 48], uncommon: [105, 17], rare: [38, 6], epic: [11, 1], legendary: [2, 0] } },
    later: { cap: 65000, c: { common: [47006, 1204], uncommon: [12411, 493], rare: [3190, 128], epic: [389, 13], legendary: [36, 1], mythic: [1, 0] } },
  }[STAGE];
  const shown = TIERS.filter(t => NUMS.c[t]);                    // hidden until found: no empty mythic shelf
  const total = t => NUMS.c[t][0] + NUMS.c[t][1];
  const inRoom = shown.reduce((n, t) => n + total(t), 0);
  const fmt = n => n.toLocaleString("en");
  const num = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "k" : fmt(n);
  if (STAGE === "full") content.closest(".app").classList.add("full");

  // always cards: your pet, favourites, holo and up, a part new to the book
  const PINNED = [
    { id: "lilac-blob", tier: "rare", active: true },
    { id: "gold-dragon", tier: "legendary", fin: "holo", glow: true, fav: true },
    { id: "bubblegum-fox", tier: "epic", fav: true },
    { id: "sky-bunny", tier: "rare", fin: "ghost", glow: true },
    { id: "toxic-cat", tier: "epic", newp: true },
    { id: "mint-bear", tier: "uncommon", fin: "holo", glow: true },
    { id: "lilac-blob-sparkle", name: "sparkle blob", tier: "rare", fin: "shiny", fav: true },
    { id: "peach-cat", tier: "common", fav: true },
  ];
  if (STAGE === "later") PINNED.splice(1, 0, { id: "abyss-void", tier: "mythic", fin: "prismatic", glow: true, fav: true });
  const nameOf = p => p.name || p.id.replace(/-/g, " ");

  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const img = (id, cls = "") => `<img class="px ${cls}" src="../assets/pets/${id}.png" alt="">`;
  const HEART = `<span data-icon="heart" data-px="1.3"></span>`;
  const MOON = `<svg viewBox="0 0 10 10"><path d="M6.4 1 Q2.4 2 2.6 5.6 Q3.4 9 7.4 8.6 Q4.6 7.4 4.8 4.6 Q5 2.4 6.4 1 Z" fill="var(--gold)"/></svg>`;
  const HOUSE = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.8 11.6 L12 4.1 L20.3 11.2"/><path d="M6 10.2 Q5.8 15 6.3 19.6 Q12 20.4 17.8 19.4 Q18.3 14.8 18 10.1"/></svg>`;
  const PAW = cls => `<svg viewBox="0 0 16 16"><g class="p ${cls}"><circle cx="3.4" cy="6.4" r="1.7"/><circle cx="6.4" cy="3.4" r="1.7"/><circle cx="9.8" cy="3.4" r="1.7"/><circle cx="12.7" cy="6.4" r="1.7"/><path d="M4.6 11.6 Q4.8 7.4 8 7.4 Q11.2 7.4 11.4 11.6 Q11.4 14 8 13.6 Q4.6 14 4.6 11.6 Z"/></g></svg>`;

  function mini(p, i = 0, extra = "") {
    const tilt = [-2, 1.5, -1, 2, -1.5, 1][i % 6];
    return `<div class="mini${p.glow ? " glow" : ""}${extra}" data-pid="${p.key || ""}" style="--tier: var(--tier-${p.tier}); --t: ${tilt}deg">
      ${p.active ? `<span class="badge moon2">${MOON}</span>` : p.newp ? `<span class="badge newp">new!</span>` : ""}
      ${p.fav ? `<span class="badge">${HEART}</span>` : ""}
      ${img(p.id)}<div class="nm">${nameOf(p)}</div>
      <div class="tr">${p.fin ? `<em>${p.fin}</em>` : p.tier}</div></div>`;
  }

  // a mound of tiny pets; how many you see grows slowly with the count
  // shrink: how much narrower each row gets (2 = a mound, 0 = level, like sand in a jar); n: exact sprite count
  function pile(tier, count, w, h, maxN, shrink = 2, nExact = 0, vs = 7, hs = 9) {
    const n = Math.min(count, nExact || Math.max(1, Math.min(maxN, Math.round(Math.log10(count + 1) * maxN / 4.8))));
    const rows = Math.max(1, Math.floor((h - 18) / vs) + 1);
    const fits = b => { let c = 0; for (let r = 0; r < rows; r++) c += Math.max(0, b - shrink * r); return c; };
    let b = shrink ? 1 : Math.floor((w - 16) / hs) + 1; while (fits(b) < n && (b * hs + 16) <= w) b++;
    const pw = (b - 1) * hs + 16, out = [];
    let k = 0;
    for (let r = 0; r < rows && k < n; r++) {
      const inRow = Math.min(Math.max(0, b - shrink * r), n - k), x0 = (b - inRow) / 2 * hs;
      for (let c = 0; c < inRow && k < n; c++, k++) {
        const id = SPR[tier][Math.floor(rnd() * SPR[tier].length)];
        const x = x0 + c * hs + (rnd() * 3 - 1.5), y = h - 18 - r * vs - rnd() * 2;
        out.push(`<img class="px${rnd() < .5 ? " flip" : ""}" src="../assets/pets/${id}.png" style="left:${x.toFixed(1)}px; top:${y.toFixed(1)}px; z-index:${rows - r}" alt="">`);
      }
    }
    return `<div class="pile" style="width:${pw}px; height:${h}px">${out.join("")}</div>`;
  }

  // ---------------- the looks ----------------
  function bar(right) {
    return `<div class="bar"><div class="seg"><button class="on">pets</button><button>toys</button><button>book</button></div><div class="right">${right}</div></div>`;
  }

  function lookA() {
    const pct = Math.min(100, inRoom / NUMS.cap * 100);
    const room = `<div class="roompill">${HOUSE}<span class="meter"><i style="width:${pct}%"></i></span><b>${num(inRoom)} <small>/ ${num(NUMS.cap)}</small></b></div>`;
    const planks = shown.map((t, i) => {
      const [plain, shiny] = NUMS.c[t], newest = [0, 1, 2, 3].map(j => SPR[t][(j + i) % SPR[t].length]);
      return `<div class="plank" data-open="${t}" style="--tier: var(--tier-${t})">
        <div class="tag" style="--t:${[-2, 1.5, -1, 2, -1.5, 1][i]}deg"><span>${t}</span><b class="num">${fmt(total(t))}</b></div>
        <div class="stand">${newest.slice(0, Math.min(4, total(t))).map((id, j) => img(id, j % 2 ? "flip" : "")).join("")}
          ${total(t) > 4 ? pile(t, total(t) - 4, 300, 36, 60) : ""}
          ${shiny ? `<span class="shine">✦ ${fmt(shiny)}</span>` : ""}</div>
      </div>`;
    }).join("");
    return `<div class="wrap">${bar(room)}
      <div class="cushion">${PINNED.slice(0, 9).map((p, i) => mini(p, i)).join("")}</div>
      <div class="case">${planks}</div></div>`;
  }

  function lookB() {
    const per = NUMS.cap / 10, filled = inRoom / per;
    const paws = `<div class="paws">${Array.from({ length: 10 }, (_, i) => PAW(i + 1 <= filled ? "on" : i < filled ? "half" : "")).join("")}<small>${num(inRoom)} / ${num(NUMS.cap)}</small></div>`;
    const W = 804, polas = PINNED.slice(0, 9), step = W / (polas.length + 0.2);
    const sag = x => 10 + 22 * Math.sin(Math.PI * x / W);
    const string = `<svg class="string" width="${W}" height="40"><path d="M0 10 Q${W / 2} 54 ${W} 10" fill="none" stroke="var(--lilac-seam)" stroke-width="2"/></svg>`;
    const pl = polas.map((p, i) => {
      const x = step * (i + 0.6) - 37;
      return `<div class="pola${p.glow ? " glow" : ""}" style="left:${x.toFixed(0)}px; top:${(sag(x + 37) + 2).toFixed(0)}px; --tier: var(--tier-${p.tier}); --t:${[-4, 3, -2, 4, -3, 2, -4, 3, -2][i]}deg">
        ${p.fav ? `<span class="badge">${HEART}</span>` : ""}<div class="ph">${img(p.id)}</div><div class="cap">${nameOf(p)}</div></div>`;
    }).join("");
    const H = shown.length > 5 ? 262 : 270;
    const jars = shown.map((t, i) => {
      const frac = Math.log10(total(t) + 1) / Math.log10(Math.max(...shown.map(total)) + 1);
      const gh = H - 28, cols = 9, rowsFit = Math.floor((gh - 22) / 11) + 1;
      return `<div class="jar" data-open="${t}" style="--tier: var(--tier-${t})">
        <div class="lid"></div><div class="neck"></div>
        <div class="glass" style="height:${H - 24}px">${pile(t, total(t), 112, gh, 0, 0, Math.max(1, Math.round(frac * .9 * rowsFit)) * cols - (i * 3) % 5, 11, 12)}
          <div class="label" style="--t:${[-3, 2, -2, 3, -1, 2][i]}deg"><span>${t}</span><b class="num">${fmt(total(t))}</b></div></div>
      </div>`;
    }).join("");
    return `<div class="wrap">${bar(paws)}<div class="bunting">${string}${pl}</div><div class="counter">${jars}</div></div>`;
  }

  function lookC() {
    const strip = `<div class="strip"><span class="home">${HOUSE}</span><div class="bar2">${shown.map(t => `<i style="width:${(total(t) / NUMS.cap * 100).toFixed(2)}%; background: var(--tier-${t})"></i>`).join("")}</div><b>${num(inRoom)} <small>/ ${num(NUMS.cap)}</small></b></div>`;
    const drawers = shown.map((t, i) => {
      const peek = Array.from({ length: Math.min(total(t), 6, 2 + Math.round(Math.log10(total(t) + 1))) }, (_, j) => img(SPR[t][(j + i) % SPR[t].length], j % 2 ? "flip" : "")).join("");
      const shiny = NUMS.c[t][1];
      return `<div class="drawer" data-open="${t}" style="--tier: var(--tier-${t})">
        <div class="peek">${peek}</div>
        <div class="holder">${t}</div><b>${fmt(total(t))}</b><div class="sh">${shiny ? `✦ ${fmt(shiny)}` : ""}</div><div class="handle"></div></div>`;
    }).join("");
    return `<div class="wrap">${bar("")}
      <div class="ontop">${PINNED.slice(0, 9).map((p, i) => mini(p, i)).join("")}</div>
      <div class="cabinet"><div class="drawers">${drawers}</div>${strip}</div></div>`;
  }

  // ---------------- a shelf, opened ----------------
  function opened(t) {
    const [plain, shiny] = NUMS.c[t];
    const special = PINNED.filter(p => p.tier === t).map((p, i) => ({ ...p, key: "s" + i }));
    const newest = Array.from({ length: Math.min(20, plain + shiny) }, (_, j) => ({ id: SPR[t][(j * 2 + 1) % SPR[t].length], tier: t, fin: j % 7 === 3 && shiny ? "shiny" : "", key: "n" + j }));
    const back = { a: "‹ shelves", b: "‹ jars", c: "‹ drawers" }[LOOK];
    return `<div class="wrap">${bar(LOOK === "a" ? lookRoomOnly() : LOOK === "b" ? lookPawsOnly() : "")}
      <div class="opened open-${LOOK}" style="--tier: var(--tier-${t})">
        <div class="shelfbox">
          <div class="open-head"><button class="link" data-back>${back}</button><span class="tn">${t}</span><span class="tc">${fmt(total(t))}</span></div>
          <div class="herd">
            <div class="herdchip">${pile(t, plain, 46, 26, 12)}<span>plain</span><b>${fmt(plain)}</b></div>
            ${shiny ? `<div class="herdchip">${pile(t, shiny, 34, 26, 8)}<span class="sh">✦ shiny</span><b>${fmt(shiny)}</b></div>` : ""}
          </div>
          <div class="cards">${special.map((p, i) => mini(p, i, i === 0 ? " on" : "")).join("")}${special.length ? `<hr class="stitch-line">` : ""}${newest.map((p, i) => mini(p, i + 1, !special.length && i === 0 ? " on" : "")).join("")}</div>
        </div>
        <div class="detail sticker"></div>
      </div></div>`;
    function lookRoomOnly() { return lookA().match(/<div class="roompill">[\s\S]*?<\/b><\/div>/)[0]; }
    function lookPawsOnly() { return lookB().match(/<div class="paws">[\s\S]*?<\/small><\/div>/)[0]; }
  }

  function showDetail(p) {
    const base = PETS.find(x => x.id === p.id) || PETS[0];
    const el = content.querySelector(".opened .detail");
    el.innerHTML = `${img(p.id)}<h2>${nameOf(p)}</h2>
      <div class="tier" style="color: var(--tier-${p.tier})">${p.tier}${p.fin ? ` <span class="fin">${p.fin}</span>` : ""}</div>
      <dl>${Object.entries(base.parts).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}
        <dt>trait</dt><dd>${base.trait}</dd></dl>
      <div class="row2"><button class="btn fav${p.fav ? " on" : ""}" title="favourite">${HEART}</button>
        <button class="btn primary">${p.active ? "your active pet" : "make active"}</button></div>`;
    paintIcons(el);
    el.querySelector(".fav").addEventListener("click", e => { p.fav = !p.fav; e.currentTarget.classList.toggle("on", p.fav); say(p.fav ? `${nameOf(p)} is going on top!` : "back on the shelf you go ♪"); });
  }

  const LINES = {
    near: "so many friends! it's getting a bit cozy in here ♪",
    full: "squish… squish… can everyone breathe in a bit?",
    later: "48 thousand commons and i still know every name. mostly.",
  };
  const OPEN_LINES = { common: "the commons! they're all a bit peachy.", uncommon: "the uncommons wave back when you wave. try it!",
    rare: "the rares! i like the rares. don't tell the commons.", epic: "ooh, the epic shelf. no running!", legendary: "shh. the legendaries are napping.", mythic: "that one hums. i don't ask." };

  function render() {
    seed = 11;
    if (OPEN && NUMS.c[OPEN]) {
      content.innerHTML = opened(OPEN);
      const t = OPEN, [plain, shiny] = NUMS.c[t];
      const special = PINNED.filter(p => p.tier === t).map((p, i) => ({ ...p, key: "s" + i }));
      const newest = Array.from({ length: Math.min(20, plain + shiny) }, (_, j) => ({ id: SPR[t][(j * 2 + 1) % SPR[t].length], tier: t, fin: j % 7 === 3 && shiny ? "shiny" : "", key: "n" + j }));
      const all = [...special, ...newest];
      showDetail(all[0]);
      content.querySelectorAll(".cards .mini").forEach(m => m.addEventListener("click", () => {
        content.querySelectorAll(".cards .mini").forEach(x => x.classList.remove("on")); m.classList.add("on");
        showDetail(all.find(p => p.key === m.dataset.pid));
      }));
      content.querySelector("[data-back]").addEventListener("click", () => { OPEN = ""; render(); say(LINES[STAGE]); });
      say(OPEN_LINES[OPEN]);
    } else {
      content.innerHTML = { a: lookA, b: lookB, c: lookC }[LOOK]();
      content.querySelectorAll("[data-open]").forEach(s => s.addEventListener("click", () => { OPEN = s.dataset.open; render(); }));
      say(LINES[STAGE]);
    }
    paintIcons(content);
  }
  render();
  applyLook(loadLook());
</script>
</body>
</html>
