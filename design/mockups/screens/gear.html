<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gear</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/themes.css">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/frame.css">
<style>
  .gear { display: grid; grid-template-columns: 1fr 250px; gap: 14px; height: 100%; min-height: 0; }
  .path { position: relative; border-radius: var(--r-panel); background: var(--paper); border: 2px solid var(--line); overflow: hidden auto; scrollbar-width: thin; scrollbar-color: var(--lilac-seam) transparent; }
  .path h2 { position: relative; margin: 14px 0 0 18px; font: var(--display-weight) 20px/1 var(--display); color: var(--pink); }
  .path h2 small { font: var(--body-weight) 12px/1 var(--body); color: var(--muted); margin-left: 8px; }
  .road { position: absolute; left: 0; top: 0; }
  .road path { fill: none; stroke: var(--pink-seam); stroke-width: 3; stroke-dasharray: 9 8; stroke-linecap: round; }
  .road path.walked { stroke: var(--pink); stroke-dasharray: none; }

  .stop { position: absolute; width: 124px; margin-left: -62px; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; }
  .stop .face {
    width: 76px; height: 76px; display: grid; place-items: center; color: var(--c);
    background: var(--raised); border: 2px solid var(--lilac-seam); border-radius: 22px; box-shadow: var(--lift);
    transform: rotate(var(--tilt)); transition: transform .15s var(--ease-out), border-color .12s;
  }
  .stop:hover .face { transform: rotate(0) translateY(-3px); }
  .stop.on .face { border: 2px dashed var(--pink); box-shadow: 0 0 0 3px var(--raised), var(--lift-hover); }
  .stop .nm { margin-top: 7px; font-size: 12px; }
  .pips { display: flex; gap: 3px; justify-content: center; margin-top: 3px; }
  .pips i { width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--line); }
  .pips i.lv { background: var(--pink); border-color: var(--pink); }
  .stop .how { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .stop .price { display: inline-flex; align-items: center; gap: 3px; margin-top: 2px; font-size: 11px; color: var(--gold); }
  .stop.poor .price { opacity: .6; }
  .stop.max .face { border-color: var(--gold); }
  .stop.max .how { color: var(--gold); }
  .stop.max .star { position: absolute; top: -6px; right: 22px; color: var(--gold); }
  .stop.fresh .face::after { content: "new!"; position: absolute; top: -9px; left: -10px; padding: 1px 6px; border-radius: 999px; background: var(--gold); color: var(--deep); font-size: 11px; transform: rotate(-8deg); }
  .stop.fresh .face { position: relative; }
  .stop.sealed { cursor: default; }
  .stop.sealed .face { background: color-mix(in srgb, var(--deep) 60%, transparent); border: 2px dashed var(--line); box-shadow: none; color: var(--locked); }
  .stop.sealed .nm { color: var(--locked); }
  .stop.close .face { border-color: color-mix(in srgb, var(--gold) 50%, var(--line)); color: var(--gold); opacity: .8; }
  .stop.close .nm { color: var(--muted); }
  .stop.bought .face { animation: squash .45s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes squash { 30% { transform: scale(1.15, .85); } }
  .spark { position: absolute; width: 6px; height: 6px; border-radius: 2px; background: var(--gold); pointer-events: none; animation: fly .8s var(--ease-out) forwards; }
  @keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(180deg); opacity: 0; } }

  /* the detail sticker */
  .detail { padding: 16px 16px 14px; display: flex; flex-direction: column; align-items: center; text-align: center; min-height: 0; position: relative; }
  .detail::before { content: ""; position: absolute; inset: 5px; border: 2px dashed var(--line); border-radius: 8px; pointer-events: none; }
  .detail .big { width: 104px; height: 104px; display: grid; place-items: center; margin-top: 4px; color: var(--c); background: var(--deep); border: 2px solid var(--lilac-seam); border-radius: 28px; transform: rotate(-3deg); }
  .detail h3 { margin: 12px 0 2px; font: var(--display-weight) 20px/1.1 var(--display); color: var(--pink); }
  .detail .does { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .detail .pips i { width: 11px; height: 11px; }
  .detail .now { margin-top: 12px; width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; text-align: left; font-size: 12px; }
  .detail .now dt { color: var(--muted); }
  .detail .now dd { margin: 0; }
  .detail .now dd.next { color: var(--mint); }
  .detail .buy { margin-top: auto; width: 100%; flex-direction: column; gap: 1px; line-height: 1.25; }
  .detail .buy small { color: var(--gold); display: inline-flex; align-items: center; gap: 3px; font-size: 11px; }
  .detail .have { margin-top: 6px; font-size: 11px; color: var(--muted); }

  /* before the tab is earned */
  .asleep { height: 100%; display: grid; place-items: center; border-radius: var(--r-panel); background: var(--paper); border: 2px dashed var(--line); }
  .asleep .note { width: 300px; padding: 20px; text-align: center; transform: rotate(-1.5deg); }
  .asleep .note img { width: 64px; height: 72px; margin: 0 auto 6px; display: block; }
  .asleep .note b { display: block; font: var(--display-weight) 18px/1.2 var(--display); color: var(--pink); font-weight: 400; margin-bottom: 6px; }
  .asleep .note span { font-size: 12px; color: var(--muted); }
  .zz { position: absolute; font: var(--display-weight) 14px var(--display); color: var(--lilac); }
</style>
</head>
<body>
<div class="app" data-tab="gear" data-say="ooh, new boots? can i try them on? just once?"></div>
<script src="../shared/pixel.js"></script>
<script src="../shared/frame.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const content = mountFrame();
  const say = t => { document.querySelector(".top .bubble").textContent = t; };
  let xp = 72;
  const xpChip = () => document.querySelector(".chip.xp");

  // gear doodles (40x40, round crayon lines)
  const ART = {
    boots: `<path d="M13 5 L22 5 L22.4 20 Q32 21 33 28 L33 33 L10 33 Q8.6 25 12 20 Z"/><path d="M13.5 10 L21.6 10 M13.4 14.2 L21.8 14.2 M10.3 29 L33 29"/>`,
    basket: `<path d="M12 17 Q20 3 28 17"/><path d="M6 17 L34 17 L31 33 Q20 35 9 33 Z"/><path d="M8 23 L32 23 M9 28 L31 28" opacity=".6"/>`,
    paws: `<circle cx="11" cy="14" r="3.2"/><circle cx="17.5" cy="9.5" r="3.2"/><circle cx="24.5" cy="9.5" r="3.2"/><circle cx="31" cy="14" r="3.2"/><path d="M12 27 Q12 18 21 18 Q30 18 30 27 Q30 33 21 32 Q12 33 12 27 Z"/>`,
    tote: `<path d="M14 13 Q14 5 20 5 Q26 5 26 13"/><path d="M7 13 Q20 12 33 13 L32 33 Q20 34.5 8 33 Z"/><path d="M16 21 Q20 24 24 21"/>`,
    leaf: `<path d="M8 32 Q6 12 30 8 Q34 30 12 32 Z"/><path d="M10 30 Q18 22 26 13" opacity=".6"/><path d="M18 19 L24 19 M21 16 L21 22" stroke="var(--pink)"/>`,
    charm: `<path d="M20 5 L20 10"/><path d="M12 22 Q12 11 20 11 Q28 11 28 22 L30 27 L10 27 Z"/><circle cx="20" cy="31" r="2.6"/><path d="M33 8 L33 13 M30.5 10.5 L35.5 10.5" stroke="var(--gold)"/>`,
    sealed: `<path d="M10 20 Q10 9 20 9 Q30 9 30 20 Q30 31 20 31 Q10 31 10 20 Z" stroke-dasharray="3 4"/><path d="M16.5 16 Q17 12.5 20.5 12.8 Q24 13.4 23.2 16.8 Q22.4 19 20 20.2 L20 22.5"/><circle cx="20" cy="27" r=".9" fill="currentColor"/>`,
  };
  const art = (k, size = 44) => `<svg width="${size}" height="${size}" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ART[k]}</svg>`;

  const WORDS = ["not yet", "a bit", "more", "lots", "so much", "the most"];
  const GEAR = [
    { id: "boots", name: "comfy boots", c: "var(--pink)", does: "pets walk faster on trips", lv: 3, max: 5, cost: 40, words: ["as usual", "a bit faster", "faster", "quite zippy", "really zippy", "whoosh"], x: 80, y: 110, tilt: -3 },
    { id: "basket", name: "a bigger basket", c: "var(--gold)", does: "more things turn up on the trail", lv: 1, max: 5, cost: 25, words: ["as usual", "a few more", "more", "lots more", "so many", "all of them"], x: 262, y: 110, tilt: 2 },
    { id: "paws", name: "sticky paws", c: "var(--lilac)", does: "things on the trail are worth more", lv: 0, max: 5, cost: 120, words: ["as usual", "a bit more", "more", "much more", "so much more", "the most"], x: 444, y: 290, tilt: -2 },
    { id: "tote", name: "a tote bag", c: "var(--cyan)", does: "pets bring more coins home", lv: 3, max: 3, cost: 0, words: ["as usual", "a bit more", "more", "a big bagful"], x: 444, y: 110, tilt: 3 },
    { id: "leaf", name: "a first-aid leaf", c: "var(--mint)", does: "one more heart on every trip", lv: 0, max: 3, cost: 60, words: ["as usual", "one more heart", "two more hearts", "three more hearts"], x: 262, y: 290, tilt: -2, fresh: true },
    { id: "s1", sealed: true, x: 80, y: 290, tilt: 2 },
    { id: "charm", name: "a hopping charm", c: "var(--gold)", close: true, x: 80, y: 470, tilt: -3 },
    { id: "s2", sealed: true, x: 262, y: 470, tilt: 3 },
    { id: "s3", sealed: true, x: 444, y: 470, tilt: -2 },
  ];
  let picked = "boots";

  function stopHtml(g) {
    if (g.sealed) return `<div class="stop sealed" style="left:${g.x}px; top:${g.y}px; --tilt:${g.tilt}deg"><div class="face">${art("sealed")}</div><div class="nm">further down the path</div></div>`;
    if (g.close) return `<div class="stop close" data-id="${g.id}" style="left:${g.x}px; top:${g.y}px; --tilt:${g.tilt}deg"><div class="face">${art("charm")}</div><div class="nm">something jingly…</div><div class="how">almost there</div></div>`;
    const max = g.lv >= g.max, poor = !max && g.cost > xp;
    return `<div class="stop${g.id === picked ? " on" : ""}${max ? " max" : ""}${poor ? " poor" : ""}${g.fresh ? " fresh" : ""}" data-id="${g.id}" style="left:${g.x}px; top:${g.y}px; --tilt:${g.tilt}deg; --c:${g.c}">
      ${max ? `<span class="star" data-icon="xp" data-px="1.6"></span>` : ""}
      <div class="face">${art(g.id)}</div>
      <div class="nm">${g.name}</div>
      <div class="pips">${Array.from({ length: g.max }, (_, i) => `<i class="${i < g.lv ? "lv" : ""}"></i>`).join("")}</div>
      <div class="how">${g.words[g.lv]}</div>
      ${max ? "" : `<div class="price"><span data-icon="xp" data-px="1.1"></span>${g.cost}</div>`}
    </div>`;
  }

  function detailHtml(g) {
    if (g.close) return `<div class="big" style="--c: var(--gold)">${art("charm", 64)}</div><h3>something jingly…</h3><div class="does">it's just past the next bend. buy a bit more gear to reach it.</div>`;
    const max = g.lv >= g.max;
    return `
      <div class="big" style="--c:${g.c}">${art(g.id, 64)}</div>
      <h3>${g.name}</h3>
      <div class="does">${g.does}</div>
      <div class="pips">${Array.from({ length: g.max }, (_, i) => `<i class="${i < g.lv ? "lv" : ""}"></i>`).join("")}</div>
      <dl class="now"><dt>now</dt><dd>${g.words[g.lv]}</dd>${max ? "" : `<dt>next</dt><dd class="next">${g.words[g.lv + 1]}</dd>`}</dl>
      ${max ? `<button class="btn buy" disabled>all done!</button>`
            : `<button class="btn primary buy" data-buy ${g.cost > xp ? "disabled" : ""}>${g.cost > xp ? "not enough xp yet" : "get it"}<small><span data-icon="xp" data-px="1.1"></span>${g.cost} xp</small></button>`}
      <div class="have">you have ${xp} xp</div>`;
  }

  function render() {
    const walked = "M80 148 L444 148";
    content.innerHTML = `
      <div class="gear">
        <div class="path" id="path">
          <h2>gear for the trips <small>bought with xp</small></h2>
          <svg class="road" width="560" height="600" aria-hidden="true">
            <path d="M80 148 L444 148 Q514 148 514 238 Q514 328 444 328 L80 328 Q14 328 14 418 Q14 508 80 508 L444 508"/>
            <path class="walked" d="${walked}"/>
          </svg>
          ${GEAR.map(stopHtml).join("")}
          <div style="height: 610px"></div>
        </div>
        <div class="detail sticker" id="detail"></div>
      </div>`;
    const g = GEAR.find(x => x.id === picked);
    content.querySelector("#detail").innerHTML = detailHtml(g);
    content.querySelectorAll(".stop[data-id]").forEach(s => s.addEventListener("click", () => { picked = s.dataset.id; render(); talk(); }));
    const buy = content.querySelector("[data-buy]");
    if (buy) buy.addEventListener("click", () => {
      xp -= g.cost; g.lv++; g.cost = Math.round(g.cost * 1.6); g.fresh = false;
      xpChip().lastChild.textContent = xp;
      render();
      const stop = content.querySelector(`.stop[data-id="${g.id}"]`);
      stop.classList.add("bought");
      for (let i = 0; i < 14; i++) {
        const s = document.createElement("i"); s.className = "spark";
        const a = Math.random() * Math.PI * 2, d = 30 + Math.random() * 40;
        s.style.left = g.x + "px"; s.style.top = g.y + 38 + "px";
        s.style.setProperty("--dx", Math.cos(a) * d + "px"); s.style.setProperty("--dy", Math.sin(a) * d + "px");
        content.querySelector("#path").appendChild(s);
      }
      say({ boots: "these boots are so comfy!! i might never take them off.", basket: "a bigger basket! for more… everything!", paws: "sticky! everything sticks! even me!", leaf: "a leaf for owies. just in case. not that anyone gets owies." }[g.id] || "ooh!");
    });
    paintIcons(content);
  }
  function talk() {
    say({ boots: "ooh, new boots? can i try them on? just once?", basket: "a bigger basket means more snacks. i did the maths.", paws: "sticky paws! grab ALL the sparkly things!", tote: "the tote bag is full of pockets. i counted. eleven.", leaf: "a leaf for owies. just in case!", charm: "i hear jingling… further down the path…" }[picked] || "");
  }

  if (params.get("state") === "locked") {
    content.innerHTML = `<div class="asleep"><div class="note sticker">
      <img class="px" src="../assets/pets/lilac-blob.png" alt="">
      <b>lilac blob is dreaming about comfy boots…</b>
      <span>bring home a little xp from a trip to wake up this page</span></div></div>`;
    say("zzz… boots… comfy… zzz");
  } else render();
  applyLook(loadLook());
</script>
</body>
</html>
