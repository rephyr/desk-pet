<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame C: Pet Floor</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/base.css">
<style>
  /* C: your pet lives on the floor at the bottom of every screen; the tabs are stickers on that floor */
  .app { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 10px 0 16px; background: var(--deep); border-bottom: 2px solid #2c1d3d; }
  .title { display: flex; align-items: center; gap: 7px; font: 18px/1 var(--display); color: var(--pink); }
  .where { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .page { flex: 1; min-height: 0; padding: 14px 16px 10px; }
  #content { height: 100%; }
  .floor { position: relative; height: 96px; flex: none; display: flex; align-items: flex-end; gap: 14px; padding: 0 14px 10px 22px; background: var(--deep); }
  .floor::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: #2c1d3d; }
  .floor .pet { width: 64px; height: 72px; margin-bottom: 6px; }
  .floor .bubble { align-self: center; max-width: 330px; padding: 8px 12px; font-size: 12px; margin-bottom: 4px; }
  .floor .bubble::before { content: ""; position: absolute; left: -8px; bottom: 14px; width: 12px; height: 12px; background: var(--raised); border-left: 2px solid var(--pink-seam); border-bottom: 2px solid var(--pink-seam); transform: rotate(45deg); }
  .tabs { margin-left: auto; display: flex; gap: 8px; align-items: flex-end; }
  .tab {
    width: 58px; height: 58px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    background: var(--raised); border: 2px solid var(--lilac-seam); border-radius: var(--r-xl);
    color: var(--text); font-size: 11px; cursor: pointer; box-shadow: var(--lift);
    transition: transform .18s var(--ease-out), color .12s, border-color .12s;
  }
  .tab:hover { color: var(--pink); border-color: var(--pink); transform: translateY(-3px); }
  .tab.on { color: var(--pink); border-color: var(--pink); background: var(--pink-pressed); transform: translateY(-12px) rotate(-4deg); box-shadow: var(--lift-hover); }
  .tab.locked { background: var(--deep); border-color: var(--muted-seam); color: #76688a; box-shadow: none; cursor: default; }
  .tab.locked:hover { transform: none; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title"><span data-icon="heart"></span>desk pets</div>
    <span class="where">/ collection</span>
    <div class="right">
      <span class="chip coins"><span data-icon="coin"></span>10,421</span>
      <span class="chip xp"><span data-icon="xp"></span>72</span>
      <div class="winbtns"><button title="shrink">▾</button><button title="close">✕</button></div>
    </div>
  </header>
  <main class="page dots"><div id="content"></div></main>
  <footer class="floor">
    <img class="px pet" src="../assets/pets/lilac-blob.png" alt="lilac blob, your active pet">
    <div class="bubble">ooh. that gold one looks… expensive. i'm still the cutest though ♪</div>
    <nav class="tabs">
      <button class="tab" data-tab><span data-icon="home"></span>home</button>
      <button class="tab" data-tab><span data-icon="boxes"></span>boxes</button>
      <button class="tab on" data-tab><span data-icon="collection"></span>pets</button>
      <button class="tab" data-tab><span data-icon="adventures"></span>trips</button>
      <button class="tab" data-tab><span data-icon="upgrades"></span>gear</button>
      <button class="tab locked" title="found on a trip"><span data-icon="lock"></span>???</button>
      <button class="tab" data-tab title="settings"><span data-icon="settings"></span>…</button>
    </nav>
  </footer>
</div>
<script src="../shared/pixel.js"></script>
<script>renderCollection(document.getElementById("content")); paintIcons(); wireTabs();</script>
</body>
</html>
